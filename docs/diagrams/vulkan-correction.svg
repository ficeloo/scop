<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" role="img" aria-labelledby="title">
<title id="title">Vulkan correction matrix</title>
<style>
.card{fill:#f6f8fa;stroke:#d0d7de}
.box{fill:#ffffff;stroke:#8c959f;stroke-width:1.2}
.boxacc{fill:#ddf4ff;stroke:#0969da;stroke-width:1.2}
.boxred{fill:#ffebe9;stroke:#cf222e;stroke-width:1.2}
.boxgreen{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.2}
.lane{fill:#eaeef2;stroke:none}
.faint{fill:#eaeef2;stroke:none}
.g1{fill:#d0d7de} .g2{fill:#afb8c1} .g3{fill:#8c959f} .g4{fill:#6e7781}
.fillacc{fill:#ddf4ff} .fillred{fill:#ffebe9} .fillgreen{fill:#dafbe1}
text{font-family:-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif;fill:#1f2328}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace}
.b{font-weight:600}
.t-text{fill:#1f2328}
.s-text{stroke:#1f2328}
.m-text{fill:#1f2328;stroke:none}
.t-muted{fill:#59636e}
.s-muted{stroke:#59636e}
.m-muted{fill:#59636e;stroke:none}
.t-acc{fill:#0969da}
.s-acc{stroke:#0969da}
.m-acc{fill:#0969da;stroke:none}
.t-red{fill:#cf222e}
.s-red{stroke:#cf222e}
.m-red{fill:#cf222e;stroke:none}
.t-green{fill:#1a7f37}
.s-green{stroke:#1a7f37}
.m-green{fill:#1a7f37;stroke:none}
.t-x{fill:#cf222e}
.s-x{stroke:#cf222e}
.m-x{fill:#cf222e;stroke:none}
.t-y{fill:#1a7f37}
.s-y{stroke:#1a7f37}
.m-y{fill:#1a7f37;stroke:none}
.t-z{fill:#0969da}
.s-z{stroke:#0969da}
.m-z{fill:#0969da;stroke:none}
.t-boxline{fill:#8c959f}
.s-boxline{stroke:#8c959f}
.m-boxline{fill:#8c959f;stroke:none}
.t-inv{fill:#ffffff}
.s-inv{stroke:#ffffff}
.m-inv{fill:#ffffff;stroke:none}
@media (prefers-color-scheme: dark) {
.card{fill:#161b22;stroke:#30363d}
.box{fill:#0d1117;stroke:#6e7681;stroke-width:1.2}
.boxacc{fill:#0c2d6b;stroke:#4493f8;stroke-width:1.2}
.boxred{fill:#4b1113;stroke:#f85149;stroke-width:1.2}
.boxgreen{fill:#0f3d1c;stroke:#3fb950;stroke-width:1.2}
.lane{fill:#21262d;stroke:none}
.faint{fill:#21262d;stroke:none}
.g1{fill:#30363d} .g2{fill:#484f58} .g3{fill:#6e7681} .g4{fill:#8b949e}
.fillacc{fill:#0c2d6b} .fillred{fill:#4b1113} .fillgreen{fill:#0f3d1c}
text{font-family:-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif;fill:#e6edf3}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace}
.b{font-weight:600}
.t-text{fill:#e6edf3}
.s-text{stroke:#e6edf3}
.m-text{fill:#e6edf3;stroke:none}
.t-muted{fill:#9198a1}
.s-muted{stroke:#9198a1}
.m-muted{fill:#9198a1;stroke:none}
.t-acc{fill:#4493f8}
.s-acc{stroke:#4493f8}
.m-acc{fill:#4493f8;stroke:none}
.t-red{fill:#f85149}
.s-red{stroke:#f85149}
.m-red{fill:#f85149;stroke:none}
.t-green{fill:#3fb950}
.s-green{stroke:#3fb950}
.m-green{fill:#3fb950;stroke:none}
.t-x{fill:#f85149}
.s-x{stroke:#f85149}
.m-x{fill:#f85149;stroke:none}
.t-y{fill:#3fb950}
.s-y{stroke:#3fb950}
.m-y{fill:#3fb950;stroke:none}
.t-z{fill:#4493f8}
.s-z{stroke:#4493f8}
.m-z{fill:#4493f8;stroke:none}
.t-boxline{fill:#6e7681}
.s-boxline{stroke:#6e7681}
.m-boxline{fill:#6e7681;stroke:none}
.t-inv{fill:#0d1117}
.s-inv{stroke:#0d1117}
.m-inv{fill:#0d1117;stroke:none}
}
</style>
<defs><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-text"/></marker><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-muted"/></marker><marker id="ar-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-acc"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-red"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-green"/></marker><marker id="ar-x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-x"/></marker><marker id="ar-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-y"/></marker><marker id="ar-z" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-z"/></marker><marker id="ar-boxline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-boxline"/></marker><marker id="ar-inv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-inv"/></marker></defs>
<rect x="0.5" y="0.5" width="859" height="339" rx="12" class="card"/>
<text x="155.0" y="36.0" font-size="14" text-anchor="middle" class="t-text b" xml:space="preserve">After perspective (OpenGL rules)</text>
<rect x="80.0" y="70.0" width="150.0" height="150.0" rx="2" fill="none" class="box"/>
<line x1="70.0" y1="145.0" x2="244.0" y2="145.0" fill="none" class="s-x" stroke-width="1.4" marker-end="url(#ar-x)"/>
<text x="252.0" y="149.0" font-size="13" text-anchor="middle" class="t-x b" xml:space="preserve">x</text>
<line x1="155.0" y1="230.0" x2="155.0" y2="56.0" fill="none" class="s-y" stroke-width="1.4" marker-end="url(#ar-y)"/>
<text x="165.0" y="62.0" font-size="13" text-anchor="start" class="t-y b" xml:space="preserve">+y</text>
<text x="72.0" y="80.0" font-size="11" text-anchor="end" class="t-muted mono" xml:space="preserve">y = +1</text>
<text x="72.0" y="220.0" font-size="11" text-anchor="end" class="t-muted mono" xml:space="preserve">y = −1</text>
<line x1="116.0" y1="191.0" x2="116.0" y2="105.0" fill="none" class="s-acc" stroke-width="3"/>
<path d="M104,121.0 L116,103.0 L128,121.0" fill="none" class="s-acc" stroke-width="3" stroke-linejoin="round"/>
<text x="155.0" y="266.0" font-size="12.5" text-anchor="middle" class="t-text mono" xml:space="preserve">depth z: −1 … 1</text>
<text x="675.0" y="36.0" font-size="14" text-anchor="middle" class="t-text b" xml:space="preserve">After C × perspective (Vulkan)</text>
<rect x="600.0" y="70.0" width="150.0" height="150.0" rx="2" fill="none" class="box"/>
<line x1="590.0" y1="145.0" x2="764.0" y2="145.0" fill="none" class="s-x" stroke-width="1.4" marker-end="url(#ar-x)"/>
<text x="772.0" y="149.0" font-size="13" text-anchor="middle" class="t-x b" xml:space="preserve">x</text>
<line x1="675.0" y1="60.0" x2="675.0" y2="234.0" fill="none" class="s-y" stroke-width="1.4" marker-end="url(#ar-y)"/>
<text x="685.0" y="236.0" font-size="13" text-anchor="start" class="t-y b" xml:space="preserve">+y</text>
<text x="592.0" y="80.0" font-size="11" text-anchor="end" class="t-muted mono" xml:space="preserve">y = −1</text>
<text x="592.0" y="220.0" font-size="11" text-anchor="end" class="t-muted mono" xml:space="preserve">y = +1</text>
<line x1="636.0" y1="191.0" x2="636.0" y2="105.0" fill="none" class="s-acc" stroke-width="3"/>
<path d="M624,121.0 L636,103.0 L648,121.0" fill="none" class="s-acc" stroke-width="3" stroke-linejoin="round"/>
<text x="675.0" y="266.0" font-size="12.5" text-anchor="middle" class="t-text mono" xml:space="preserve">depth z: 0 … 1</text>
<line x1="310.0" y1="145.0" x2="560.0" y2="145.0" fill="none" class="s-acc" stroke-width="2" marker-end="url(#ar-acc)"/>
<text x="435.0" y="128.0" font-size="18" text-anchor="middle" class="t-acc b mono" xml:space="preserve">C</text>
<text x="435.0" y="176.0" font-size="12" text-anchor="middle" class="t-text mono" xml:space="preserve">row 2:  y&#x27; = −y</text>
<text x="435.0" y="194.0" font-size="12" text-anchor="middle" class="t-text mono" xml:space="preserve">row 3:  z&#x27; = z/2 + w/2</text>
<text x="435.0" y="212.0" font-size="12" text-anchor="middle" class="t-text mono" xml:space="preserve">after ÷ w:  (z + 1) / 2</text>
<text x="430.0" y="322.0" font-size="11.5" text-anchor="middle" class="t-muted" xml:space="preserve">Vulkan&#x27;s y axis points down and its depth goes from 0 to 1. C flips y so the image stays upright (blue arrow).</text>
</svg>
