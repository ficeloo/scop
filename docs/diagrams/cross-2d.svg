<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" role="img" aria-labelledby="title">
<title id="title">Signed area in 2D</title>
<style>
.card{fill:#f6f8fa;stroke:#d0d7de}
.box{fill:#ffffff;stroke:#8c959f;stroke-width:1.2}
.boxacc{fill:#ddf4ff;stroke:#0969da;stroke-width:1.2}
.boxred{fill:#ffebe9;stroke:#cf222e;stroke-width:1.2}
.boxgreen{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.2}
.lane{fill:#eaeef2;stroke:none}
.faint{fill:#eaeef2;stroke:none}
.g1{fill:#d0d7de} .g2{fill:#afb8c1} .g3{fill:#8c959f} .g4{fill:#6e7781}
.fillacc{fill:#ddf4ff} .fillred{fill:#ffebe9} .fillgreen{fill:#dafbe1}
text{font-family:-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif;fill:#1f2328}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace}
.b{font-weight:600}
.t-text{fill:#1f2328}
.s-text{stroke:#1f2328}
.m-text{fill:#1f2328;stroke:none}
.t-muted{fill:#59636e}
.s-muted{stroke:#59636e}
.m-muted{fill:#59636e;stroke:none}
.t-acc{fill:#0969da}
.s-acc{stroke:#0969da}
.m-acc{fill:#0969da;stroke:none}
.t-red{fill:#cf222e}
.s-red{stroke:#cf222e}
.m-red{fill:#cf222e;stroke:none}
.t-green{fill:#1a7f37}
.s-green{stroke:#1a7f37}
.m-green{fill:#1a7f37;stroke:none}
.t-x{fill:#cf222e}
.s-x{stroke:#cf222e}
.m-x{fill:#cf222e;stroke:none}
.t-y{fill:#1a7f37}
.s-y{stroke:#1a7f37}
.m-y{fill:#1a7f37;stroke:none}
.t-z{fill:#0969da}
.s-z{stroke:#0969da}
.m-z{fill:#0969da;stroke:none}
.t-boxline{fill:#8c959f}
.s-boxline{stroke:#8c959f}
.m-boxline{fill:#8c959f;stroke:none}
.t-inv{fill:#ffffff}
.s-inv{stroke:#ffffff}
.m-inv{fill:#ffffff;stroke:none}
@media (prefers-color-scheme: dark) {
.card{fill:#161b22;stroke:#30363d}
.box{fill:#0d1117;stroke:#6e7681;stroke-width:1.2}
.boxacc{fill:#0c2d6b;stroke:#4493f8;stroke-width:1.2}
.boxred{fill:#4b1113;stroke:#f85149;stroke-width:1.2}
.boxgreen{fill:#0f3d1c;stroke:#3fb950;stroke-width:1.2}
.lane{fill:#21262d;stroke:none}
.faint{fill:#21262d;stroke:none}
.g1{fill:#30363d} .g2{fill:#484f58} .g3{fill:#6e7681} .g4{fill:#8b949e}
.fillacc{fill:#0c2d6b} .fillred{fill:#4b1113} .fillgreen{fill:#0f3d1c}
text{font-family:-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif;fill:#e6edf3}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace}
.b{font-weight:600}
.t-text{fill:#e6edf3}
.s-text{stroke:#e6edf3}
.m-text{fill:#e6edf3;stroke:none}
.t-muted{fill:#9198a1}
.s-muted{stroke:#9198a1}
.m-muted{fill:#9198a1;stroke:none}
.t-acc{fill:#4493f8}
.s-acc{stroke:#4493f8}
.m-acc{fill:#4493f8;stroke:none}
.t-red{fill:#f85149}
.s-red{stroke:#f85149}
.m-red{fill:#f85149;stroke:none}
.t-green{fill:#3fb950}
.s-green{stroke:#3fb950}
.m-green{fill:#3fb950;stroke:none}
.t-x{fill:#f85149}
.s-x{stroke:#f85149}
.m-x{fill:#f85149;stroke:none}
.t-y{fill:#3fb950}
.s-y{stroke:#3fb950}
.m-y{fill:#3fb950;stroke:none}
.t-z{fill:#4493f8}
.s-z{stroke:#4493f8}
.m-z{fill:#4493f8;stroke:none}
.t-boxline{fill:#6e7681}
.s-boxline{stroke:#6e7681}
.m-boxline{fill:#6e7681;stroke:none}
.t-inv{fill:#0d1117}
.s-inv{stroke:#0d1117}
.m-inv{fill:#0d1117;stroke:none}
}
</style>
<defs><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-text"/></marker><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-muted"/></marker><marker id="ar-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-acc"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-red"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-green"/></marker><marker id="ar-x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-x"/></marker><marker id="ar-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-y"/></marker><marker id="ar-z" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-z"/></marker><marker id="ar-boxline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-boxline"/></marker><marker id="ar-inv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-inv"/></marker></defs>
<rect x="0.5" y="0.5" width="859" height="339" rx="12" class="card"/>
<text x="140.0" y="34.0" font-size="14" text-anchor="middle" class="t-text b" xml:space="preserve">Turns left at b</text>
<polygon points="60.0,220.0 190.0,220.0 150.0,90.0" fill="none" class="fillgreen s-green" stroke-width="1.6" stroke-linejoin="round"/>
<circle cx="60.0" cy="220.0" r="4" class="m-text"/>
<text x="46.0" y="225.0" font-size="13" text-anchor="middle" class="t-text b mono" xml:space="preserve">a</text>
<circle cx="190.0" cy="220.0" r="4" class="m-text"/>
<text x="204.0" y="225.0" font-size="13" text-anchor="middle" class="t-text b mono" xml:space="preserve">b</text>
<circle cx="150.0" cy="90.0" r="4" class="m-text"/>
<text x="164.0" y="95.0" font-size="13" text-anchor="middle" class="t-text b mono" xml:space="preserve">c</text>
<text x="140.0" y="272.0" font-size="12" text-anchor="middle" class="t-text" xml:space="preserve">cross(a, b, c) &gt; 0</text>
<text x="140.0" y="289.0" font-size="12" text-anchor="middle" class="t-text" xml:space="preserve">convex corner: can be an ear</text>
<path d="M100,206 L160,206 L152,170" fill="none" class="s-green" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ar-green)"/>
<text x="410.0" y="34.0" font-size="14" text-anchor="middle" class="t-text b" xml:space="preserve">Turns right at b</text>
<polygon points="320.0,110.0 450.0,110.0 410.0,230.0" fill="none" class="fillred s-red" stroke-width="1.6" stroke-linejoin="round"/>
<circle cx="320.0" cy="110.0" r="4" class="m-text"/>
<text x="306.0" y="115.0" font-size="13" text-anchor="middle" class="t-text b mono" xml:space="preserve">a</text>
<circle cx="450.0" cy="110.0" r="4" class="m-text"/>
<text x="464.0" y="115.0" font-size="13" text-anchor="middle" class="t-text b mono" xml:space="preserve">b</text>
<circle cx="410.0" cy="230.0" r="4" class="m-text"/>
<text x="424.0" y="235.0" font-size="13" text-anchor="middle" class="t-text b mono" xml:space="preserve">c</text>
<text x="410.0" y="272.0" font-size="12" text-anchor="middle" class="t-text" xml:space="preserve">cross(a, b, c) &lt; 0</text>
<text x="410.0" y="289.0" font-size="12" text-anchor="middle" class="t-text" xml:space="preserve">reflex corner: never an ear</text>
<path d="M360,124 L420,124 L412,160" fill="none" class="s-red" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ar-red)"/>
<text x="690.0" y="34.0" font-size="14" text-anchor="middle" class="t-text b" xml:space="preserve">Point in triangle</text>
<polygon points="580.0,230.0 800.0,230.0 690.0,80.0" fill="none" class="fillacc s-acc" stroke-width="1.6" stroke-linejoin="round"/>
<circle cx="580.0" cy="230.0" r="4" class="m-text"/>
<text x="566.0" y="235.0" font-size="13" text-anchor="middle" class="t-text b mono" xml:space="preserve">a</text>
<circle cx="800.0" cy="230.0" r="4" class="m-text"/>
<text x="814.0" y="235.0" font-size="13" text-anchor="middle" class="t-text b mono" xml:space="preserve">b</text>
<circle cx="690.0" cy="80.0" r="4" class="m-text"/>
<text x="676.0" y="85.0" font-size="13" text-anchor="middle" class="t-text b mono" xml:space="preserve">c</text>
<text x="690.0" y="272.0" font-size="12" text-anchor="middle" class="t-text" xml:space="preserve">cross(p, b, c) ≥ 0, cross(a, p, c) ≥ 0</text>
<text x="690.0" y="289.0" font-size="12" text-anchor="middle" class="t-text" xml:space="preserve">and cross(a, b, p) ≥ 0  →  p is inside</text>
<circle cx="690.0" cy="180.0" r="5" class="m-red"/>
<text x="702.0" y="184.0" font-size="13" text-anchor="start" class="t-red b mono" xml:space="preserve">p</text>
<text x="430.0" y="326.0" font-size="12" text-anchor="middle" class="t-muted mono" xml:space="preserve">cross(a, b, c) = (b − a) × (c − a) = twice the signed area of the triangle (y up)</text>
</svg>
