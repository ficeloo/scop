<svg xmlns="http://www.w3.org/2000/svg" width="860" height="610" viewBox="0 0 860 610" role="img" aria-labelledby="title">
<title id="title">From the .obj file to a pixel</title>
<style>
.card{fill:#f6f8fa;stroke:#d0d7de}
.box{fill:#ffffff;stroke:#8c959f;stroke-width:1.2}
.boxacc{fill:#ddf4ff;stroke:#0969da;stroke-width:1.2}
.boxred{fill:#ffebe9;stroke:#cf222e;stroke-width:1.2}
.boxgreen{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.2}
.lane{fill:#eaeef2;stroke:none}
.faint{fill:#eaeef2;stroke:none}
.g1{fill:#d0d7de} .g2{fill:#afb8c1} .g3{fill:#8c959f} .g4{fill:#6e7781}
.fillacc{fill:#ddf4ff} .fillred{fill:#ffebe9} .fillgreen{fill:#dafbe1}
text{font-family:-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif;fill:#1f2328}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace}
.b{font-weight:600}
.t-text{fill:#1f2328}
.s-text{stroke:#1f2328}
.m-text{fill:#1f2328;stroke:none}
.t-muted{fill:#59636e}
.s-muted{stroke:#59636e}
.m-muted{fill:#59636e;stroke:none}
.t-acc{fill:#0969da}
.s-acc{stroke:#0969da}
.m-acc{fill:#0969da;stroke:none}
.t-red{fill:#cf222e}
.s-red{stroke:#cf222e}
.m-red{fill:#cf222e;stroke:none}
.t-green{fill:#1a7f37}
.s-green{stroke:#1a7f37}
.m-green{fill:#1a7f37;stroke:none}
.t-x{fill:#cf222e}
.s-x{stroke:#cf222e}
.m-x{fill:#cf222e;stroke:none}
.t-y{fill:#1a7f37}
.s-y{stroke:#1a7f37}
.m-y{fill:#1a7f37;stroke:none}
.t-z{fill:#0969da}
.s-z{stroke:#0969da}
.m-z{fill:#0969da;stroke:none}
.t-boxline{fill:#8c959f}
.s-boxline{stroke:#8c959f}
.m-boxline{fill:#8c959f;stroke:none}
.t-inv{fill:#ffffff}
.s-inv{stroke:#ffffff}
.m-inv{fill:#ffffff;stroke:none}
@media (prefers-color-scheme: dark) {
.card{fill:#161b22;stroke:#30363d}
.box{fill:#0d1117;stroke:#6e7681;stroke-width:1.2}
.boxacc{fill:#0c2d6b;stroke:#4493f8;stroke-width:1.2}
.boxred{fill:#4b1113;stroke:#f85149;stroke-width:1.2}
.boxgreen{fill:#0f3d1c;stroke:#3fb950;stroke-width:1.2}
.lane{fill:#21262d;stroke:none}
.faint{fill:#21262d;stroke:none}
.g1{fill:#30363d} .g2{fill:#484f58} .g3{fill:#6e7681} .g4{fill:#8b949e}
.fillacc{fill:#0c2d6b} .fillred{fill:#4b1113} .fillgreen{fill:#0f3d1c}
text{font-family:-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif;fill:#e6edf3}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace}
.b{font-weight:600}
.t-text{fill:#e6edf3}
.s-text{stroke:#e6edf3}
.m-text{fill:#e6edf3;stroke:none}
.t-muted{fill:#9198a1}
.s-muted{stroke:#9198a1}
.m-muted{fill:#9198a1;stroke:none}
.t-acc{fill:#4493f8}
.s-acc{stroke:#4493f8}
.m-acc{fill:#4493f8;stroke:none}
.t-red{fill:#f85149}
.s-red{stroke:#f85149}
.m-red{fill:#f85149;stroke:none}
.t-green{fill:#3fb950}
.s-green{stroke:#3fb950}
.m-green{fill:#3fb950;stroke:none}
.t-x{fill:#f85149}
.s-x{stroke:#f85149}
.m-x{fill:#f85149;stroke:none}
.t-y{fill:#3fb950}
.s-y{stroke:#3fb950}
.m-y{fill:#3fb950;stroke:none}
.t-z{fill:#4493f8}
.s-z{stroke:#4493f8}
.m-z{fill:#4493f8;stroke:none}
.t-boxline{fill:#6e7681}
.s-boxline{stroke:#6e7681}
.m-boxline{fill:#6e7681;stroke:none}
.t-inv{fill:#0d1117}
.s-inv{stroke:#0d1117}
.m-inv{fill:#0d1117;stroke:none}
}
</style>
<defs><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-text"/></marker><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-muted"/></marker><marker id="ar-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-acc"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-red"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-green"/></marker><marker id="ar-x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-x"/></marker><marker id="ar-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-y"/></marker><marker id="ar-z" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-z"/></marker><marker id="ar-boxline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-boxline"/></marker><marker id="ar-inv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-inv"/></marker></defs>
<rect x="0.5" y="0.5" width="859" height="609" rx="12" class="card"/>
<rect x="40.0" y="24.0" width="240.0" height="60.0" rx="8" fill="none" class="boxacc"/>
<text x="160.0" y="51.1" font-size="14" text-anchor="middle" class="t-text b" xml:space="preserve">Model space</text>
<text x="160.0" y="72.3" font-size="11.5" text-anchor="middle" class="t-muted" xml:space="preserve">the .obj, centred, size 1.5</text>
<line x1="160.0" y1="86.0" x2="160.0" y2="134.0" fill="none" class="s-acc" stroke-width="1.4" marker-end="url(#ar-acc)"/>
<text x="320.0" y="90.0" font-size="12.5" text-anchor="start" class="t-text b mono" xml:space="preserve">model = T × orientation × R_auto</text>
<text x="830.0" y="90.0" font-size="10.5" text-anchor="end" class="t-muted b" xml:space="preserve">push constant</text>
<text x="320.0" y="108.0" font-size="12" text-anchor="start" class="t-muted" xml:space="preserve">places the object in the scene: automatic spin,</text>
<text x="320.0" y="123.0" font-size="12" text-anchor="start" class="t-muted" xml:space="preserve">manual rotations, then the move</text>
<rect x="40.0" y="136.0" width="240.0" height="60.0" rx="8" fill="none" class="box"/>
<text x="160.0" y="163.1" font-size="14" text-anchor="middle" class="t-text b" xml:space="preserve">World space</text>
<text x="160.0" y="184.3" font-size="11.5" text-anchor="middle" class="t-muted" xml:space="preserve">the scene, Z is up</text>
<line x1="160.0" y1="198.0" x2="160.0" y2="246.0" fill="none" class="s-acc" stroke-width="1.4" marker-end="url(#ar-acc)"/>
<text x="320.0" y="202.0" font-size="12.5" text-anchor="start" class="t-text b mono" xml:space="preserve">view = look_at_rh(EYE, CENTER, UP)</text>
<text x="830.0" y="202.0" font-size="10.5" text-anchor="end" class="t-muted b" xml:space="preserve">uniform buffer</text>
<text x="320.0" y="220.0" font-size="12" text-anchor="start" class="t-muted" xml:space="preserve">moves the whole world so that the camera</text>
<text x="320.0" y="235.0" font-size="12" text-anchor="start" class="t-muted" xml:space="preserve">sits at the origin (EYE = (3, 0, 1))</text>
<rect x="40.0" y="248.0" width="240.0" height="60.0" rx="8" fill="none" class="box"/>
<text x="160.0" y="275.1" font-size="14" text-anchor="middle" class="t-text b" xml:space="preserve">Camera space</text>
<text x="160.0" y="296.3" font-size="11.5" text-anchor="middle" class="t-muted" xml:space="preserve">camera at (0, 0, 0), looking down −Z</text>
<line x1="160.0" y1="310.0" x2="160.0" y2="358.0" fill="none" class="s-acc" stroke-width="1.4" marker-end="url(#ar-acc)"/>
<text x="320.0" y="314.0" font-size="12.5" text-anchor="start" class="t-text b mono" xml:space="preserve">proj = C × perspective(45°, aspect, 0.1, 10)</text>
<text x="830.0" y="314.0" font-size="10.5" text-anchor="end" class="t-muted b" xml:space="preserve">uniform buffer</text>
<text x="320.0" y="332.0" font-size="12" text-anchor="start" class="t-muted" xml:space="preserve">perspective: w = −z, so far points get closer to the</text>
<text x="320.0" y="347.0" font-size="12" text-anchor="start" class="t-muted" xml:space="preserve">centre; C flips Y and maps depth to [0, 1] (Vulkan)</text>
<rect x="40.0" y="360.0" width="240.0" height="60.0" rx="8" fill="none" class="box"/>
<text x="160.0" y="387.1" font-size="14" text-anchor="middle" class="t-text b" xml:space="preserve">Clip space</text>
<text x="160.0" y="408.3" font-size="11.5" text-anchor="middle" class="t-muted" xml:space="preserve">4D: (x, y, z, w)</text>
<line x1="160.0" y1="422.0" x2="160.0" y2="470.0" fill="none" class="s-acc" stroke-width="1.4" marker-end="url(#ar-acc)"/>
<text x="320.0" y="426.0" font-size="12.5" text-anchor="start" class="t-text b mono" xml:space="preserve">done by the GPU</text>
<text x="830.0" y="426.0" font-size="10.5" text-anchor="end" class="t-muted b" xml:space="preserve">fixed function</text>
<text x="320.0" y="444.0" font-size="12" text-anchor="start" class="t-muted" xml:space="preserve">divides x, y, z by w, then maps [−1, 1]</text>
<text x="320.0" y="459.0" font-size="12" text-anchor="start" class="t-muted" xml:space="preserve">to the pixels of the window (viewport)</text>
<rect x="40.0" y="472.0" width="240.0" height="60.0" rx="8" fill="none" class="boxacc"/>
<text x="160.0" y="499.1" font-size="14" text-anchor="middle" class="t-text b" xml:space="preserve">Pixel</text>
<text x="160.0" y="520.3" font-size="11.5" text-anchor="middle" class="t-muted" xml:space="preserve">x, y in the window, depth in [0, 1]</text>
<text x="430.0" y="592.0" font-size="12" text-anchor="middle" class="t-text mono" xml:space="preserve">shader.vert:  gl_Position = proj * view * model * vec4(inPosition, 1.0)</text>
</svg>
