<defs><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-text"/></marker><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-muted"/></marker><marker id="ar-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-acc"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-red"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-green"/></marker><marker id="ar-x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-x"/></marker><marker id="ar-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-y"/></marker><marker id="ar-z" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-z"/></marker><marker id="ar-boxline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-boxline"/></marker><marker id="ar-inv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-inv"/></marker></defs>
<rect x="0.5" y="0.5" width="859" height="379" rx="12" class="card"/>
<line x1="230.0" y1="330.0" x2="230.0" y2="60.0" fill="none" class="s-acc" stroke-width="2.2" marker-end="url(#ar-acc)"/>
<text x="240.0" y="66.0" font-size="13" text-anchor="start" class="t-acc b" xml:space="preserve">axis k (unit length)</text>
<path d="M380.0,170.0 L379.4,173.7 L377.7,177.3 L374.9,180.9 L371.0,184.4 L365.9,187.7 L359.9,191.0 L352.9,194.1 L344.9,197.0 L336.1,199.7 L326.4,202.2 L316.0,204.4 L305.0,206.4 L293.4,208.1 L281.3,209.5 L268.8,210.6 L256.0,211.4 L243.1,211.8 L230.0,212.0 L216.9,211.8 L204.0,211.4 L191.2,210.6 L178.7,209.5 L166.6,208.1 L155.0,206.4 L144.0,204.4 L133.6,202.2 L123.9,199.7 L115.1,197.0 L107.1,194.1 L100.1,191.0 L94.1,187.7 L89.0,184.4 L85.1,180.9 L82.3,177.3 L80.6,173.7 L80.0,170.0 L80.6,166.3 L82.3,162.7 L85.1,159.1 L89.0,155.6 L94.1,152.3 L100.1,149.0 L107.1,145.9 L115.1,143.0 L123.9,140.3 L133.6,137.8 L144.0,135.6 L155.0,133.6 L166.6,131.9 L178.7,130.5 L191.2,129.4 L204.0,128.6 L216.9,128.2 L230.0,128.0 L243.1,128.2 L256.0,128.6 L268.8,129.4 L281.3,130.5 L293.4,131.9 L305.0,133.6 L316.0,135.6 L326.4,137.8 L336.1,140.3 L344.9,143.0 L352.9,145.9 L359.9,149.0 L365.9,152.3 L371.0,155.6 L374.9,159.1 L377.7,162.7 L379.4,166.3 L380.0,170.0" fill="none" class="s-muted" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="4 3"/>
<line x1="230.0" y1="320.0" x2="80.0" y2="170.0" fill="none" class="s-text" stroke-width="2" marker-end="url(#ar-text)"/>
<line x1="230.0" y1="320.0" x2="281.3" y2="209.5" fill="none" class="s-red" stroke-width="2" marker-end="url(#ar-red)"/>
<text x="70.0" y="174.0" font-size="15" text-anchor="end" class="t-text b mono" xml:space="preserve">v</text>
<text x="291.3" y="225.5" font-size="15" text-anchor="start" class="t-red b mono" xml:space="preserve">R · v</text>
<line x1="230.0" y1="170.0" x2="80.0" y2="170.0" fill="none" class="s-muted" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="230.0" y1="170.0" x2="281.3" y2="209.5" fill="none" class="s-muted" stroke-width="1" stroke-dasharray="3 3"/>
<path d="M155.0,170.0 L155.2,171.7 L156.0,173.3 L157.1,175.0 L158.8,176.6 L160.9,178.2 L163.5,179.7 L166.5,181.2 L169.8,182.5 L173.6,183.8 L177.7,185.1 L182.2,186.2 L187.0,187.2 L192.0,188.1 L197.3,188.9 L202.8,189.6 L208.5,190.1 L214.3,190.5 L220.2,190.8 L226.2,191.0 L232.2,191.0 L238.2,190.9 L244.1,190.6 L249.9,190.2 L255.7,189.7" fill="none" class="s-red" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ar-red)"/>
<text x="200.0" y="208.0" font-size="16" text-anchor="middle" class="t-red b" xml:space="preserve">θ</text>
<circle cx="230.0" cy="170.0" r="4" class="m-acc"/>
<text x="238.0" y="162.0" font-size="12" text-anchor="start" class="t-acc mono" xml:space="preserve">k (k · v)</text>
<text x="230.0" y="360.0" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">the part of v along k does not move; the rest turns on the circle</text>
<text x="230.0" y="34.0" font-size="14" text-anchor="middle" class="t-text b" xml:space="preserve">v turns by θ around k</text>
<text x="490.0" y="80.0" font-size="13" text-anchor="start" class="t-text b" xml:space="preserve">Vector form (Rodrigues):</text>
<text x="490.0" y="106.0" font-size="13" text-anchor="start" class="t-text mono" xml:space="preserve">R·v = v cos θ + (k × v) sin θ</text>
<text x="490.0" y="126.0" font-size="13" text-anchor="start" class="t-text mono" xml:space="preserve">      + k (k · v)(1 − cos θ)</text>
<text x="490.0" y="168.0" font-size="12.5" text-anchor="start" class="t-text" xml:space="preserve">from_axis_angle builds the same thing</text>
<text x="490.0" y="186.0" font-size="12.5" text-anchor="start" class="t-text" xml:space="preserve">as a matrix. With k = Z, its top-left</text>
<text x="490.0" y="204.0" font-size="12.5" text-anchor="start" class="t-text" xml:space="preserve">2 × 2 block is the 2D rotation:</text>
<text x="510.0" y="234.0" font-size="13" text-anchor="start" class="t-text mono" xml:space="preserve">| cos θ   −sin θ |</text>
<text x="510.0" y="254.0" font-size="13" text-anchor="start" class="t-text mono" xml:space="preserve">| sin θ    cos θ |</text>
<text x="490.0" y="300.0" font-size="11.5" text-anchor="start" class="t-muted mono" xml:space="preserve">R_auto = from_axis_angle(Z, curr_angle)</text>
<text x="490.0" y="318.0" font-size="11.5" text-anchor="start" class="t-muted mono" xml:space="preserve">orientation × from_axis_angle(axis, …)</text>
</svg>
