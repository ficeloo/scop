<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560" role="img" aria-labelledby="title">
<title id="title">From the .obj file to the GPU</title>
<style>
.card{fill:#f6f8fa;stroke:#d0d7de}
.box{fill:#ffffff;stroke:#8c959f;stroke-width:1.2}
.boxacc{fill:#ddf4ff;stroke:#0969da;stroke-width:1.2}
.boxred{fill:#ffebe9;stroke:#cf222e;stroke-width:1.2}
.boxgreen{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.2}
.lane{fill:#eaeef2;stroke:none}
.faint{fill:#eaeef2;stroke:none}
.g1{fill:#d0d7de} .g2{fill:#afb8c1} .g3{fill:#8c959f} .g4{fill:#6e7781}
.fillacc{fill:#ddf4ff} .fillred{fill:#ffebe9} .fillgreen{fill:#dafbe1}
text{font-family:-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif;fill:#1f2328}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace}
.b{font-weight:600}
.t-text{fill:#1f2328}
.s-text{stroke:#1f2328}
.m-text{fill:#1f2328;stroke:none}
.t-muted{fill:#59636e}
.s-muted{stroke:#59636e}
.m-muted{fill:#59636e;stroke:none}
.t-acc{fill:#0969da}
.s-acc{stroke:#0969da}
.m-acc{fill:#0969da;stroke:none}
.t-red{fill:#cf222e}
.s-red{stroke:#cf222e}
.m-red{fill:#cf222e;stroke:none}
.t-green{fill:#1a7f37}
.s-green{stroke:#1a7f37}
.m-green{fill:#1a7f37;stroke:none}
.t-x{fill:#cf222e}
.s-x{stroke:#cf222e}
.m-x{fill:#cf222e;stroke:none}
.t-y{fill:#1a7f37}
.s-y{stroke:#1a7f37}
.m-y{fill:#1a7f37;stroke:none}
.t-z{fill:#0969da}
.s-z{stroke:#0969da}
.m-z{fill:#0969da;stroke:none}
.t-boxline{fill:#8c959f}
.s-boxline{stroke:#8c959f}
.m-boxline{fill:#8c959f;stroke:none}
.t-inv{fill:#ffffff}
.s-inv{stroke:#ffffff}
.m-inv{fill:#ffffff;stroke:none}
@media (prefers-color-scheme: dark) {
.card{fill:#161b22;stroke:#30363d}
.box{fill:#0d1117;stroke:#6e7681;stroke-width:1.2}
.boxacc{fill:#0c2d6b;stroke:#4493f8;stroke-width:1.2}
.boxred{fill:#4b1113;stroke:#f85149;stroke-width:1.2}
.boxgreen{fill:#0f3d1c;stroke:#3fb950;stroke-width:1.2}
.lane{fill:#21262d;stroke:none}
.faint{fill:#21262d;stroke:none}
.g1{fill:#30363d} .g2{fill:#484f58} .g3{fill:#6e7681} .g4{fill:#8b949e}
.fillacc{fill:#0c2d6b} .fillred{fill:#4b1113} .fillgreen{fill:#0f3d1c}
text{font-family:-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif;fill:#e6edf3}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace}
.b{font-weight:600}
.t-text{fill:#e6edf3}
.s-text{stroke:#e6edf3}
.m-text{fill:#e6edf3;stroke:none}
.t-muted{fill:#9198a1}
.s-muted{stroke:#9198a1}
.m-muted{fill:#9198a1;stroke:none}
.t-acc{fill:#4493f8}
.s-acc{stroke:#4493f8}
.m-acc{fill:#4493f8;stroke:none}
.t-red{fill:#f85149}
.s-red{stroke:#f85149}
.m-red{fill:#f85149;stroke:none}
.t-green{fill:#3fb950}
.s-green{stroke:#3fb950}
.m-green{fill:#3fb950;stroke:none}
.t-x{fill:#f85149}
.s-x{stroke:#f85149}
.m-x{fill:#f85149;stroke:none}
.t-y{fill:#3fb950}
.s-y{stroke:#3fb950}
.m-y{fill:#3fb950;stroke:none}
.t-z{fill:#4493f8}
.s-z{stroke:#4493f8}
.m-z{fill:#4493f8;stroke:none}
.t-boxline{fill:#6e7681}
.s-boxline{stroke:#6e7681}
.m-boxline{fill:#6e7681;stroke:none}
.t-inv{fill:#0d1117}
.s-inv{stroke:#0d1117}
.m-inv{fill:#0d1117;stroke:none}
}
</style>
<defs><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-text"/></marker><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-muted"/></marker><marker id="ar-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-acc"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-red"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-green"/></marker><marker id="ar-x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-x"/></marker><marker id="ar-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-y"/></marker><marker id="ar-z" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-z"/></marker><marker id="ar-boxline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-boxline"/></marker><marker id="ar-inv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-inv"/></marker></defs>
<rect x="0.5" y="0.5" width="859" height="559" rx="12" class="card"/>
<rect x="40.0" y="28.0" width="250.0" height="58.0" rx="8" fill="none" class="box"/>
<text x="165.0" y="54.1" font-size="14" text-anchor="middle" class="t-text b" xml:space="preserve">.obj file</text>
<text x="165.0" y="75.3" font-size="11.5" text-anchor="middle" class="t-muted mono" xml:space="preserve">plain text</text>
<text x="320.0" y="52.0" font-size="12" text-anchor="start" class="t-text mono" xml:space="preserve">v 0 0 0    v 1 0 0    v 1 1 0    v 0 1 0</text>
<text x="320.0" y="69.0" font-size="12" text-anchor="start" class="t-text mono" xml:space="preserve">f 1 2 3 4</text>
<line x1="165.0" y1="88.0" x2="165.0" y2="114.0" fill="none" class="s-boxline" stroke-width="1.4" marker-end="url(#ar-boxline)"/>
<rect x="40.0" y="116.0" width="250.0" height="58.0" rx="8" fill="none" class="box"/>
<text x="165.0" y="142.1" font-size="14" text-anchor="middle" class="t-text b mono" xml:space="preserve">parse_obj</text>
<text x="165.0" y="163.3" font-size="11.5" text-anchor="middle" class="t-muted mono" xml:space="preserve">src/obj.rs</text>
<text x="320.0" y="132.0" font-size="10.5" text-anchor="start" class="t-muted b" xml:space="preserve">READS EVERY LINE</text>
<text x="320.0" y="151.0" font-size="12.5" text-anchor="start" class="t-text" xml:space="preserve">v, vt, vn  →  positions, tex_coords, normals</text>
<text x="320.0" y="168.0" font-size="12.5" text-anchor="start" class="t-text" xml:space="preserve">f  →  one face = a list of corners (FaceVertex)</text>
<line x1="165.0" y1="176.0" x2="165.0" y2="202.0" fill="none" class="s-boxline" stroke-width="1.4" marker-end="url(#ar-boxline)"/>
<rect x="40.0" y="204.0" width="250.0" height="58.0" rx="8" fill="none" class="box"/>
<text x="165.0" y="230.1" font-size="14" text-anchor="middle" class="t-text b mono" xml:space="preserve">triangulate_face</text>
<text x="165.0" y="251.3" font-size="11.5" text-anchor="middle" class="t-muted mono" xml:space="preserve">src/obj.rs</text>
<text x="320.0" y="220.0" font-size="10.5" text-anchor="start" class="t-muted b" xml:space="preserve">CALLED ON EACH F LINE</text>
<text x="320.0" y="239.0" font-size="12" text-anchor="start" class="t-text mono" xml:space="preserve">a face with n corners  →  n − 2 triangles</text>
<text x="320.0" y="256.0" font-size="12" text-anchor="start" class="t-text mono" xml:space="preserve">f 1 2 3 4  →  (4, 1, 2) (2, 3, 4)</text>
<line x1="165.0" y1="264.0" x2="165.0" y2="290.0" fill="none" class="s-boxline" stroke-width="1.4" marker-end="url(#ar-boxline)"/>
<rect x="40.0" y="292.0" width="250.0" height="58.0" rx="8" fill="none" class="box"/>
<text x="165.0" y="318.1" font-size="14" text-anchor="middle" class="t-text b mono" xml:space="preserve">load_model</text>
<text x="165.0" y="339.3" font-size="11.5" text-anchor="middle" class="t-muted mono" xml:space="preserve">src/model.rs</text>
<text x="320.0" y="308.0" font-size="10.5" text-anchor="start" class="t-muted b" xml:space="preserve">BUILDS THE VERTEX LIST</text>
<text x="320.0" y="327.0" font-size="12.5" text-anchor="start" class="t-text" xml:space="preserve">centre on the bounding box, scale to 1.5, (x, y, z) → (z, x, y)</text>
<text x="320.0" y="344.0" font-size="12.5" text-anchor="start" class="t-text" xml:space="preserve">same FaceVertex = same vertex: 6 corners → 4 vertices + 6 indices</text>
<line x1="165.0" y1="352.0" x2="165.0" y2="378.0" fill="none" class="s-boxline" stroke-width="1.4" marker-end="url(#ar-boxline)"/>
<rect x="40.0" y="380.0" width="250.0" height="58.0" rx="8" fill="none" class="box"/>
<text x="165.0" y="406.1" font-size="14" text-anchor="middle" class="t-text b mono" xml:space="preserve">staging buffer → GPU</text>
<text x="165.0" y="427.3" font-size="11.5" text-anchor="middle" class="t-muted mono" xml:space="preserve">src/vulkan/buffer.rs</text>
<text x="320.0" y="396.0" font-size="10.5" text-anchor="start" class="t-muted b" xml:space="preserve">COPIED ONCE</text>
<text x="320.0" y="415.0" font-size="12" text-anchor="start" class="t-text mono" xml:space="preserve">vertex buffer: 4 × Vertex (pos, color, tex_coord)</text>
<text x="320.0" y="432.0" font-size="12" text-anchor="start" class="t-text mono" xml:space="preserve">index buffer:  6 × u32 = 0 1 2  2 3 0</text>
<line x1="165.0" y1="440.0" x2="165.0" y2="466.0" fill="none" class="s-boxline" stroke-width="1.4" marker-end="url(#ar-boxline)"/>
<rect x="40.0" y="468.0" width="250.0" height="58.0" rx="8" fill="none" class="boxacc"/>
<text x="165.0" y="494.1" font-size="14" text-anchor="middle" class="t-text b mono" xml:space="preserve">cmd_draw_indexed</text>
<text x="165.0" y="515.3" font-size="11.5" text-anchor="middle" class="t-muted mono" xml:space="preserve">src/app/render.rs</text>
<text x="320.0" y="484.0" font-size="10.5" text-anchor="start" class="t-acc b" xml:space="preserve">EVERY FRAME</text>
<text x="320.0" y="503.0" font-size="12.5" text-anchor="start" class="t-text" xml:space="preserve">the GPU reads the 6 indices</text>
<text x="320.0" y="520.0" font-size="12.5" text-anchor="start" class="t-text" xml:space="preserve">→ draws 2 triangles</text>
<line x1="832.0" y1="116.0" x2="832.0" y2="438.0" fill="none" class="s-muted" stroke-width="1.2"/>
<line x1="824.0" y1="116.0" x2="832.0" y2="116.0" fill="none" class="s-muted" stroke-width="1.2"/>
<line x1="824.0" y1="438.0" x2="832.0" y2="438.0" fill="none" class="s-muted" stroke-width="1.2"/>
<text x="846" y="277.0" font-size="11" text-anchor="middle" class="t-muted b" transform="rotate(90 846 277.0)">ONCE PER MODEL LOAD</text>
</svg>
