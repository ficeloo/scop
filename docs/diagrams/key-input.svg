<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title">
<title id="title">Keyboard input</title>
<style>
.card{fill:#f6f8fa;stroke:#d0d7de}
.box{fill:#ffffff;stroke:#8c959f;stroke-width:1.2}
.boxacc{fill:#ddf4ff;stroke:#0969da;stroke-width:1.2}
.boxred{fill:#ffebe9;stroke:#cf222e;stroke-width:1.2}
.boxgreen{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.2}
.lane{fill:#eaeef2;stroke:none}
.faint{fill:#eaeef2;stroke:none}
.g1{fill:#d0d7de} .g2{fill:#afb8c1} .g3{fill:#8c959f} .g4{fill:#6e7781}
.fillacc{fill:#ddf4ff} .fillred{fill:#ffebe9} .fillgreen{fill:#dafbe1}
text{font-family:-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif;fill:#1f2328}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace}
.b{font-weight:600}
.t-text{fill:#1f2328}
.s-text{stroke:#1f2328}
.m-text{fill:#1f2328;stroke:none}
.t-muted{fill:#59636e}
.s-muted{stroke:#59636e}
.m-muted{fill:#59636e;stroke:none}
.t-acc{fill:#0969da}
.s-acc{stroke:#0969da}
.m-acc{fill:#0969da;stroke:none}
.t-red{fill:#cf222e}
.s-red{stroke:#cf222e}
.m-red{fill:#cf222e;stroke:none}
.t-green{fill:#1a7f37}
.s-green{stroke:#1a7f37}
.m-green{fill:#1a7f37;stroke:none}
.t-x{fill:#cf222e}
.s-x{stroke:#cf222e}
.m-x{fill:#cf222e;stroke:none}
.t-y{fill:#1a7f37}
.s-y{stroke:#1a7f37}
.m-y{fill:#1a7f37;stroke:none}
.t-z{fill:#0969da}
.s-z{stroke:#0969da}
.m-z{fill:#0969da;stroke:none}
.t-boxline{fill:#8c959f}
.s-boxline{stroke:#8c959f}
.m-boxline{fill:#8c959f;stroke:none}
.t-inv{fill:#ffffff}
.s-inv{stroke:#ffffff}
.m-inv{fill:#ffffff;stroke:none}
@media (prefers-color-scheme: dark) {
.card{fill:#161b22;stroke:#30363d}
.box{fill:#0d1117;stroke:#6e7681;stroke-width:1.2}
.boxacc{fill:#0c2d6b;stroke:#4493f8;stroke-width:1.2}
.boxred{fill:#4b1113;stroke:#f85149;stroke-width:1.2}
.boxgreen{fill:#0f3d1c;stroke:#3fb950;stroke-width:1.2}
.lane{fill:#21262d;stroke:none}
.faint{fill:#21262d;stroke:none}
.g1{fill:#30363d} .g2{fill:#484f58} .g3{fill:#6e7681} .g4{fill:#8b949e}
.fillacc{fill:#0c2d6b} .fillred{fill:#4b1113} .fillgreen{fill:#0f3d1c}
text{font-family:-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif;fill:#e6edf3}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace}
.b{font-weight:600}
.t-text{fill:#e6edf3}
.s-text{stroke:#e6edf3}
.m-text{fill:#e6edf3;stroke:none}
.t-muted{fill:#9198a1}
.s-muted{stroke:#9198a1}
.m-muted{fill:#9198a1;stroke:none}
.t-acc{fill:#4493f8}
.s-acc{stroke:#4493f8}
.m-acc{fill:#4493f8;stroke:none}
.t-red{fill:#f85149}
.s-red{stroke:#f85149}
.m-red{fill:#f85149;stroke:none}
.t-green{fill:#3fb950}
.s-green{stroke:#3fb950}
.m-green{fill:#3fb950;stroke:none}
.t-x{fill:#f85149}
.s-x{stroke:#f85149}
.m-x{fill:#f85149;stroke:none}
.t-y{fill:#3fb950}
.s-y{stroke:#3fb950}
.m-y{fill:#3fb950;stroke:none}
.t-z{fill:#4493f8}
.s-z{stroke:#4493f8}
.m-z{fill:#4493f8;stroke:none}
.t-boxline{fill:#6e7681}
.s-boxline{stroke:#6e7681}
.m-boxline{fill:#6e7681;stroke:none}
.t-inv{fill:#0d1117}
.s-inv{stroke:#0d1117}
.m-inv{fill:#0d1117;stroke:none}
}
</style>
<defs><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-text"/></marker><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-muted"/></marker><marker id="ar-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-acc"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-red"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-green"/></marker><marker id="ar-x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-x"/></marker><marker id="ar-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-y"/></marker><marker id="ar-z" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-z"/></marker><marker id="ar-boxline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-boxline"/></marker><marker id="ar-inv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-inv"/></marker></defs>
<rect x="0.5" y="0.5" width="899" height="499" rx="12" class="card"/>
<rect x="60.0" y="22.0" width="260.0" height="46.0" rx="8" fill="none" class="box"/>
<text x="190.0" y="41.8" font-size="13" text-anchor="middle" class="t-text b" xml:space="preserve">KeyboardInput event</text>
<text x="190.0" y="63.0" font-size="11.5" text-anchor="middle" class="t-muted" xml:space="preserve">physical key (KeyCode)</text>
<line x1="190.0" y1="70.0" x2="190.0" y2="92.0" fill="none" class="s-boxline" stroke-width="1.4" marker-end="url(#ar-boxline)"/>
<polygon points="190.0,94.0 340.0,128.0 190.0,162.0 40.0,128.0" class="box"/>
<text x="190.0" y="124.4" font-size="12" text-anchor="middle" class="t-text b" xml:space="preserve">move or rotate key?</text>
<text x="190.0" y="140.0" font-size="12" text-anchor="middle" class="t-text" xml:space="preserve">W A S D Q E  /  I K U O J L</text>
<line x1="340.0" y1="128.0" x2="420.0" y2="128.0" fill="none" class="s-green" stroke-width="1.4" marker-end="url(#ar-green)"/>
<text x="380.0" y="121.0" font-size="12" text-anchor="middle" class="t-green" xml:space="preserve">yes</text>
<rect x="422.0" y="100.0" width="210.0" height="56.0" rx="8" fill="none" class="box"/>
<text x="527.0" y="124.8" font-size="13" text-anchor="middle" class="t-text b mono" xml:space="preserve">pressed_keys</text>
<text x="527.0" y="146.0" font-size="11.5" text-anchor="middle" class="t-muted" xml:space="preserve">press: insert, release: remove</text>
<line x1="190.0" y1="162.0" x2="190.0" y2="190.0" fill="none" class="s-boxline" stroke-width="1.4" marker-end="url(#ar-boxline)"/>
<text x="200.0" y="180.0" font-size="12" text-anchor="start" class="t-muted" xml:space="preserve">no</text>
<polygon points="190.0,192.0 290.0,220.0 190.0,248.0 90.0,220.0" class="box"/>
<text x="190.0" y="224.4" font-size="12.5" text-anchor="middle" class="t-text b" xml:space="preserve">Left Shift?</text>
<line x1="290.0" y1="220.0" x2="420.0" y2="220.0" fill="none" class="s-green" stroke-width="1.4" marker-end="url(#ar-green)"/>
<text x="355.0" y="213.0" font-size="12" text-anchor="middle" class="t-green" xml:space="preserve">yes</text>
<rect x="422.0" y="196.0" width="210.0" height="48.0" rx="8" fill="none" class="box"/>
<text x="527.0" y="216.8" font-size="13" text-anchor="middle" class="t-text b mono" xml:space="preserve">lin_vel = 2.0</text>
<text x="527.0" y="238.0" font-size="11.5" text-anchor="middle" class="t-muted" xml:space="preserve">while held, 1.0 after</text>
<line x1="190.0" y1="248.0" x2="190.0" y2="276.0" fill="none" class="s-boxline" stroke-width="1.4" marker-end="url(#ar-boxline)"/>
<text x="200.0" y="266.0" font-size="12" text-anchor="start" class="t-muted" xml:space="preserve">no</text>
<polygon points="190.0,278.0 310.0,308.0 190.0,338.0 70.0,308.0" class="box"/>
<text x="190.0" y="304.2" font-size="12.5" text-anchor="middle" class="t-text b" xml:space="preserve">pressed, and</text>
<text x="190.0" y="320.5" font-size="12.5" text-anchor="middle" class="t-text" xml:space="preserve">not a repeat?</text>
<line x1="190.0" y1="338.0" x2="190.0" y2="362.0" fill="none" class="s-green" stroke-width="1.4" marker-end="url(#ar-green)"/>
<text x="200.0" y="354.0" font-size="12" text-anchor="start" class="t-green" xml:space="preserve">yes</text>
<rect x="80.0" y="364.0" width="220.0" height="44.0" rx="8" fill="none" class="box"/>
<text x="190.0" y="390.6" font-size="13" text-anchor="middle" class="t-text b mono" xml:space="preserve">handle_input → Signal</text>
<text x="314.0" y="382.0" font-size="11" text-anchor="start" class="t-muted" xml:space="preserve">a reload only sets a flag:</text>
<text x="314.0" y="396.0" font-size="11" text-anchor="start" class="t-muted" xml:space="preserve">done at the start of render</text>
<text x="40.0" y="432.0" font-size="11.5" text-anchor="start" class="t-text b mono" xml:space="preserve">Enter</text>
<text x="96.0" y="432.0" font-size="11.5" text-anchor="start" class="t-muted" xml:space="preserve">ReloadModel (file picker)</text>
<text x="40.0" y="449.0" font-size="11.5" text-anchor="start" class="t-text b mono" xml:space="preserve">← →</text>
<text x="96.0" y="449.0" font-size="11.5" text-anchor="start" class="t-muted" xml:space="preserve">ReloadTexture (skipped in grey view)</text>
<text x="40.0" y="466.0" font-size="11.5" text-anchor="start" class="t-text b mono" xml:space="preserve">1 2 3</text>
<text x="96.0" y="466.0" font-size="11.5" text-anchor="start" class="t-muted" xml:space="preserve">TextureAxe, then ReloadModel</text>
<text x="40.0" y="483.0" font-size="11.5" text-anchor="start" class="t-text b mono" xml:space="preserve">M</text>
<text x="96.0" y="483.0" font-size="11.5" text-anchor="start" class="t-muted" xml:space="preserve">ToggleMeshView</text>
<text x="340.0" y="432.0" font-size="11.5" text-anchor="start" class="t-text b mono" xml:space="preserve">= -</text>
<text x="396.0" y="432.0" font-size="11.5" text-anchor="start" class="t-muted" xml:space="preserve">UpdateAngleSpeed ∓15°/s</text>
<text x="340.0" y="449.0" font-size="11.5" text-anchor="start" class="t-text b mono" xml:space="preserve">0</text>
<text x="396.0" y="449.0" font-size="11.5" text-anchor="start" class="t-muted" xml:space="preserve">StopRotation</text>
<text x="340.0" y="466.0" font-size="11.5" text-anchor="start" class="t-text b mono" xml:space="preserve">Escape</text>
<text x="396.0" y="466.0" font-size="11.5" text-anchor="start" class="t-muted" xml:space="preserve">Exit</text>
<rect x="656.0" y="22.0" width="224.0" height="394.0" rx="8" fill="none" class="boxacc"/>
<text x="768.0" y="48.0" font-size="13.5" text-anchor="middle" class="t-text b" xml:space="preserve">Every frame (render)</text>
<text x="670.0" y="74.0" font-size="11.5" text-anchor="start" class="t-text b mono" xml:space="preserve">dir</text>
<text x="670.0" y="89.0" font-size="11" text-anchor="start" class="t-muted mono" xml:space="preserve">sum of the held move keys</text>
<text x="670.0" y="112.0" font-size="11.5" text-anchor="start" class="t-text b mono" xml:space="preserve">world_dir</text>
<text x="670.0" y="127.0" font-size="11" text-anchor="start" class="t-muted mono" xml:space="preserve">normalize(f·dir.x + s·dir.y</text>
<text x="670.0" y="141.0" font-size="11" text-anchor="start" class="t-muted mono" xml:space="preserve">          + u·dir.z)</text>
<text x="670.0" y="164.0" font-size="11.5" text-anchor="start" class="t-text b mono" xml:space="preserve">position</text>
<text x="670.0" y="179.0" font-size="11" text-anchor="start" class="t-muted mono" xml:space="preserve">+= world_dir × lin_vel × dt</text>
<text x="670.0" y="202.0" font-size="11.5" text-anchor="start" class="t-text b mono" xml:space="preserve">axis</text>
<text x="670.0" y="217.0" font-size="11" text-anchor="start" class="t-muted mono" xml:space="preserve">normalize(sum of the held</text>
<text x="670.0" y="231.0" font-size="11" text-anchor="start" class="t-muted mono" xml:space="preserve">          rotate keys)</text>
<text x="670.0" y="254.0" font-size="11.5" text-anchor="start" class="t-text b mono" xml:space="preserve">orientation</text>
<text x="670.0" y="269.0" font-size="11" text-anchor="start" class="t-muted mono" xml:space="preserve">= orientation</text>
<text x="670.0" y="283.0" font-size="11" text-anchor="start" class="t-muted mono" xml:space="preserve">  × R(axis, 50°/s × dt)</text>
<text x="670.0" y="306.0" font-size="11.5" text-anchor="start" class="t-text b mono" xml:space="preserve">curr_angle</text>
<text x="670.0" y="321.0" font-size="11" text-anchor="start" class="t-muted mono" xml:space="preserve">+= ang_vel × dt</text>
<text x="670.0" y="344.0" font-size="11.5" text-anchor="start" class="t-text b mono" xml:space="preserve">mesh_view_value</text>
<text x="670.0" y="359.0" font-size="11" text-anchor="start" class="t-muted mono" xml:space="preserve">± 5 × dt, kept in [0, 1]</text>
<text x="670.0" y="390.0" font-size="10" text-anchor="start" class="t-muted mono" xml:space="preserve">f, s, u = camera_basis(</text>
<text x="670.0" y="403.0" font-size="10" text-anchor="start" class="t-muted mono" xml:space="preserve">    CENTER − EYE, UP)</text>
<line x1="634.0" y1="128.0" x2="654.0" y2="128.0" fill="none" class="s-acc" stroke-width="1.4" marker-end="url(#ar-acc)"/>
<line x1="634.0" y1="220.0" x2="654.0" y2="220.0" fill="none" class="s-acc" stroke-width="1.4" marker-end="url(#ar-acc)"/>
</svg>
