<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" role="img" aria-labelledby="title">
<title id="title">Scop in 6 steps</title>
<style>
.card{fill:#f6f8fa;stroke:#d0d7de}
.box{fill:#ffffff;stroke:#8c959f;stroke-width:1.2}
.boxacc{fill:#ddf4ff;stroke:#0969da;stroke-width:1.2}
.boxred{fill:#ffebe9;stroke:#cf222e;stroke-width:1.2}
.boxgreen{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.2}
.lane{fill:#eaeef2;stroke:none}
.faint{fill:#eaeef2;stroke:none}
.g1{fill:#d0d7de} .g2{fill:#afb8c1} .g3{fill:#8c959f} .g4{fill:#6e7781}
.fillacc{fill:#ddf4ff} .fillred{fill:#ffebe9} .fillgreen{fill:#dafbe1}
text{font-family:-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif;fill:#1f2328}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace}
.b{font-weight:600}
.t-text{fill:#1f2328}
.s-text{stroke:#1f2328}
.m-text{fill:#1f2328;stroke:none}
.t-muted{fill:#59636e}
.s-muted{stroke:#59636e}
.m-muted{fill:#59636e;stroke:none}
.t-acc{fill:#0969da}
.s-acc{stroke:#0969da}
.m-acc{fill:#0969da;stroke:none}
.t-red{fill:#cf222e}
.s-red{stroke:#cf222e}
.m-red{fill:#cf222e;stroke:none}
.t-green{fill:#1a7f37}
.s-green{stroke:#1a7f37}
.m-green{fill:#1a7f37;stroke:none}
.t-x{fill:#cf222e}
.s-x{stroke:#cf222e}
.m-x{fill:#cf222e;stroke:none}
.t-y{fill:#1a7f37}
.s-y{stroke:#1a7f37}
.m-y{fill:#1a7f37;stroke:none}
.t-z{fill:#0969da}
.s-z{stroke:#0969da}
.m-z{fill:#0969da;stroke:none}
.t-boxline{fill:#8c959f}
.s-boxline{stroke:#8c959f}
.m-boxline{fill:#8c959f;stroke:none}
.t-inv{fill:#ffffff}
.s-inv{stroke:#ffffff}
.m-inv{fill:#ffffff;stroke:none}
@media (prefers-color-scheme: dark) {
.card{fill:#161b22;stroke:#30363d}
.box{fill:#0d1117;stroke:#6e7681;stroke-width:1.2}
.boxacc{fill:#0c2d6b;stroke:#4493f8;stroke-width:1.2}
.boxred{fill:#4b1113;stroke:#f85149;stroke-width:1.2}
.boxgreen{fill:#0f3d1c;stroke:#3fb950;stroke-width:1.2}
.lane{fill:#21262d;stroke:none}
.faint{fill:#21262d;stroke:none}
.g1{fill:#30363d} .g2{fill:#484f58} .g3{fill:#6e7681} .g4{fill:#8b949e}
.fillacc{fill:#0c2d6b} .fillred{fill:#4b1113} .fillgreen{fill:#0f3d1c}
text{font-family:-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif;fill:#e6edf3}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace}
.b{font-weight:600}
.t-text{fill:#e6edf3}
.s-text{stroke:#e6edf3}
.m-text{fill:#e6edf3;stroke:none}
.t-muted{fill:#9198a1}
.s-muted{stroke:#9198a1}
.m-muted{fill:#9198a1;stroke:none}
.t-acc{fill:#4493f8}
.s-acc{stroke:#4493f8}
.m-acc{fill:#4493f8;stroke:none}
.t-red{fill:#f85149}
.s-red{stroke:#f85149}
.m-red{fill:#f85149;stroke:none}
.t-green{fill:#3fb950}
.s-green{stroke:#3fb950}
.m-green{fill:#3fb950;stroke:none}
.t-x{fill:#f85149}
.s-x{stroke:#f85149}
.m-x{fill:#f85149;stroke:none}
.t-y{fill:#3fb950}
.s-y{stroke:#3fb950}
.m-y{fill:#3fb950;stroke:none}
.t-z{fill:#4493f8}
.s-z{stroke:#4493f8}
.m-z{fill:#4493f8;stroke:none}
.t-boxline{fill:#6e7681}
.s-boxline{stroke:#6e7681}
.m-boxline{fill:#6e7681;stroke:none}
.t-inv{fill:#0d1117}
.s-inv{stroke:#0d1117}
.m-inv{fill:#0d1117;stroke:none}
}
</style>
<defs><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-text"/></marker><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-muted"/></marker><marker id="ar-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-acc"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-red"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-green"/></marker><marker id="ar-x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-x"/></marker><marker id="ar-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-y"/></marker><marker id="ar-z" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-z"/></marker><marker id="ar-boxline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-boxline"/></marker><marker id="ar-inv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-inv"/></marker></defs>
<rect x="0.5" y="0.5" width="859" height="339" rx="12" class="card"/>
<text x="40.0" y="38.0" font-size="11.5" text-anchor="start" class="t-muted b" xml:space="preserve">ONCE, WHEN A MODEL IS LOADED</text>
<rect x="40.0" y="52.0" width="230.0" height="86.0" rx="8" fill="none" class="box"/>
<text x="155.0" y="83.7" font-size="14" text-anchor="middle" class="t-text b" xml:space="preserve">1. Read the .obj file</text>
<text x="155.0" y="105.5" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">a list of points (vertices)</text>
<text x="155.0" y="121.4" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">and faces that join them</text>
<line x1="274.0" y1="95.0" x2="311.0" y2="95.0" fill="none" class="s-boxline" stroke-width="1.4" marker-end="url(#ar-boxline)"/>
<rect x="315.0" y="52.0" width="230.0" height="86.0" rx="8" fill="none" class="box"/>
<text x="430.0" y="83.7" font-size="14" text-anchor="middle" class="t-text b" xml:space="preserve">2. Cut faces into triangles</text>
<text x="430.0" y="105.5" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">the graphics card only</text>
<text x="430.0" y="121.4" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">draws triangles</text>
<line x1="549.0" y1="95.0" x2="586.0" y2="95.0" fill="none" class="s-boxline" stroke-width="1.4" marker-end="url(#ar-boxline)"/>
<rect x="590.0" y="52.0" width="230.0" height="86.0" rx="8" fill="none" class="box"/>
<text x="705.0" y="83.7" font-size="14" text-anchor="middle" class="t-text b" xml:space="preserve">3. Send them to the GPU</text>
<text x="705.0" y="105.5" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">stored in the memory</text>
<text x="705.0" y="121.4" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">of the graphics card</text>
<text x="40.0" y="198.0" font-size="11.5" text-anchor="start" class="t-muted b" xml:space="preserve">EVERY FRAME, MANY TIMES PER SECOND</text>
<rect x="40.0" y="212.0" width="230.0" height="86.0" rx="8" fill="none" class="boxacc"/>
<text x="155.0" y="243.7" font-size="14" text-anchor="middle" class="t-text b" xml:space="preserve">4. Place the object</text>
<text x="155.0" y="265.5" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">move, turn, then put it</text>
<text x="155.0" y="281.4" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">in perspective (matrices)</text>
<line x1="274.0" y1="255.0" x2="311.0" y2="255.0" fill="none" class="s-boxline" stroke-width="1.4" marker-end="url(#ar-boxline)"/>
<rect x="315.0" y="212.0" width="230.0" height="86.0" rx="8" fill="none" class="boxacc"/>
<text x="430.0" y="243.7" font-size="14" text-anchor="middle" class="t-text b" xml:space="preserve">5. Colour every pixel</text>
<text x="430.0" y="265.5" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">a shade of grey, or a</text>
<text x="430.0" y="281.4" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">piece of the texture</text>
<line x1="549.0" y1="255.0" x2="586.0" y2="255.0" fill="none" class="s-boxline" stroke-width="1.4" marker-end="url(#ar-boxline)"/>
<rect x="590.0" y="212.0" width="230.0" height="86.0" rx="8" fill="none" class="boxacc"/>
<text x="705.0" y="243.7" font-size="14" text-anchor="middle" class="t-text b" xml:space="preserve">6. Show the image</text>
<text x="705.0" y="265.5" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">in the window,</text>
<text x="705.0" y="281.4" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">then start again</text>
<path d="M705.0,142 L705.0,162 L155.0,162 L155.0,208" fill="none" class="s-boxline" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ar-boxline)"/>
<path d="M824,255.0 L842,255.0 L842,320 L155.0,320 L155.0,302" fill="none" class="s-acc" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ar-acc)"/>
</svg>
