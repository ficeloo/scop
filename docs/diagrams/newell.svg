<defs><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-text"/></marker><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-muted"/></marker><marker id="ar-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-acc"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-red"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-green"/></marker><marker id="ar-x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-x"/></marker><marker id="ar-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-y"/></marker><marker id="ar-z" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-z"/></marker><marker id="ar-boxline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-boxline"/></marker><marker id="ar-inv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-inv"/></marker></defs>
<rect x="0.5" y="0.5" width="859" height="379" rx="12" class="card"/>
<polygon points="170.0,250.0 111.9,276.7 279.2,293.7 331.0,238.5" fill="none" class="fillacc s-acc" stroke-width="1.6" stroke-linejoin="round"/>
<circle cx="170.0" cy="250.0" r="4" class="m-text"/>
<text x="156.0" y="254.0" font-size="12.5" text-anchor="middle" class="t-text b mono" xml:space="preserve">p0</text>
<circle cx="111.9" cy="276.7" r="4" class="m-text"/>
<text x="101.9" y="296.7" font-size="12.5" text-anchor="middle" class="t-text b mono" xml:space="preserve">p1</text>
<circle cx="279.2" cy="293.7" r="4" class="m-text"/>
<text x="293.2" y="309.7" font-size="12.5" text-anchor="middle" class="t-text b mono" xml:space="preserve">p2</text>
<circle cx="331.0" cy="238.5" r="4" class="m-text"/>
<text x="341.0" y="230.5" font-size="12.5" text-anchor="middle" class="t-text b mono" xml:space="preserve">p3</text>
<line x1="223.0" y1="264.7" x2="225.6" y2="138.9" fill="none" class="s-red" stroke-width="2.2" marker-end="url(#ar-red)"/>
<text x="235.6" y="142.9" font-size="12" text-anchor="start" class="t-red b mono" xml:space="preserve">n = (0.05, 0.09, 2.95)</text>
<text x="200.0" y="34.0" font-size="14" text-anchor="middle" class="t-text b" xml:space="preserve">A face that is not quite flat</text>
<text x="40.0" y="330.0" font-size="11.5" text-anchor="start" class="t-muted" xml:space="preserve">n_x = Σ (yᵢ − yᵢ₊₁)(zᵢ + zᵢ₊₁), same idea for n_y, n_z:</text>
<text x="40.0" y="345.5" font-size="11.5" text-anchor="start" class="t-muted" xml:space="preserve">it works even if the corners are not in one plane</text>
<line x1="420.0" y1="180.0" x2="520.0" y2="180.0" fill="none" class="s-acc" stroke-width="2" marker-end="url(#ar-acc)"/>
<text x="470.0" y="173.0" font-size="13" text-anchor="middle" class="t-acc" xml:space="preserve">drop z</text>
<text x="470.0" y="204.0" font-size="11.5" text-anchor="middle" class="t-muted" xml:space="preserve">|n_z| is the largest</text>
<line x1="570.0" y1="290.0" x2="800.0" y2="290.0" fill="none" class="s-x" stroke-width="1.2" marker-end="url(#ar-x)"/>
<text x="806.0" y="294.0" font-size="13" text-anchor="start" class="t-x b" xml:space="preserve">x</text>
<line x1="570.0" y1="290.0" x2="570.0" y2="70.0" fill="none" class="s-y" stroke-width="1.2" marker-end="url(#ar-y)"/>
<text x="564.0" y="74.0" font-size="13" text-anchor="end" class="t-y b" xml:space="preserve">y</text>
<polygon points="590.0,270.0 722.0,258.0 710.0,90.0 590.0,102.0" fill="none" class="fillacc s-acc" stroke-width="1.6" stroke-linejoin="round"/>
<circle cx="590.0" cy="270.0" r="4" class="m-text"/>
<text x="578.0" y="288.0" font-size="12.5" text-anchor="middle" class="t-text b mono" xml:space="preserve">p0</text>
<circle cx="722.0" cy="258.0" r="4" class="m-text"/>
<text x="736.0" y="276.0" font-size="12.5" text-anchor="middle" class="t-text b mono" xml:space="preserve">p1</text>
<circle cx="710.0" cy="90.0" r="4" class="m-text"/>
<text x="726.0" y="84.0" font-size="12.5" text-anchor="middle" class="t-text b mono" xml:space="preserve">p2</text>
<circle cx="590.0" cy="102.0" r="4" class="m-text"/>
<text x="576.0" y="94.0" font-size="12.5" text-anchor="middle" class="t-text b mono" xml:space="preserve">p3</text>
<path d="M682.0,190.0 A28,28 0 1 0 676.0,200.0" fill="none" class="s-acc" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ar-acc)"/>
<text x="654.0" y="185.0" font-size="11" text-anchor="middle" class="t-acc b" xml:space="preserve">CCW</text>
<text x="700.0" y="34.0" font-size="14" text-anchor="middle" class="t-text b" xml:space="preserve">Same corners, in 2D</text>
<text x="470.0" y="330.0" font-size="11.5" text-anchor="start" class="t-muted" xml:space="preserve">n_z &gt; 0: keep (x, y) = ((k+1) % 3, (k+2) % 3) = (x, y)</text>
<text x="470.0" y="345.5" font-size="11.5" text-anchor="start" class="t-muted" xml:space="preserve">n_k &lt; 0: the two axes are swapped, so the corners still turn CCW</text>
</svg>
