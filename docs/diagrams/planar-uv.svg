<line x1="360.0" y1="208.8" x2="341.7" y2="219.4" fill="none" class="s-red" stroke-width="0.8"/>
<line x1="265.0" y1="137.5" x2="246.7" y2="148.1" fill="none" class="s-red" stroke-width="0.8"/>
