<rect x="610.0" y="70.0" width="180.0" height="180.0" rx="2" fill="none" class="s-acc"/>
<text x="602.0" y="74.0" font-size="11.5" text-anchor="end" class="t-text mono" xml:space="preserve">(0, 0)</text>
<text x="798.0" y="254.0" font-size="11.5" text-anchor="start" class="t-text mono" xml:space="preserve">(1, 1)</text>
<text x="700.0" y="272.0" font-size="12.5" text-anchor="middle" class="t-text mono" xml:space="preserve">u →</text>
<text x="594.0" y="160.0" font-size="12.5" text-anchor="end" class="t-text mono" xml:space="preserve">v ↓</text>
<text x="700.0" y="50.0" font-size="14" text-anchor="middle" class="t-text b" xml:space="preserve">The texture (UV space)</text>
<line x1="450.0" y1="120.0" x2="598.0" y2="120.0" fill="none" class="s-acc" stroke-width="1.8" marker-end="url(#ar-acc)"/>
<text x="524.0" y="110.0" font-size="11.5" text-anchor="middle" class="t-acc" xml:space="preserve">front face</text>
<text x="480.0" y="306.0" font-size="11.5" text-anchor="start" class="t-muted" xml:space="preserve">u = (p − min) / (max − min) on each axis kept</text>
<text x="480.0" y="321.5" font-size="11.5" text-anchor="start" class="t-muted" xml:space="preserve">key 2 (default) keeps the 2 widest axes;</text>
<text x="480.0" y="337.1" font-size="11.5" text-anchor="start" class="t-muted" xml:space="preserve">keys 1 and 3 keep the thin one (more stripes)</text>
</svg>
