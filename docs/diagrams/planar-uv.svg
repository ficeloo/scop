<text x="190.0" y="34.0" font-size="14" text-anchor="middle" class="t-text b" xml:space="preserve">Bounding box of the model</text>
<text x="40.0" y="352.0" font-size="12" text-anchor="start" class="t-muted" xml:space="preserve">thinnest side here: x. It is dropped; the 2 other axes become u and v.</text>
<text x="380.0" y="160.0" font-size="12" text-anchor="start" class="t-red b" xml:space="preserve">stretched:</text>
<text x="380.0" y="176.0" font-size="12" text-anchor="start" class="t-red" xml:space="preserve">faces parallel to</text>
<text x="380.0" y="192.0" font-size="12" text-anchor="start" class="t-red" xml:space="preserve">the dropped axis</text>
<rect x="610.0" y="70.0" width="180.0" height="180.0" rx="2" fill="none" class="fillacc"/>
<line x1="655.0" y1="70.0" x2="655.0" y2="250.0" fill="none" class="s-acc" stroke-width="0.8"/>
<line x1="610.0" y1="115.0" x2="790.0" y2="115.0" fill="none" class="s-acc" stroke-width="0.8"/>
