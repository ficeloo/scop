<defs><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-text"/></marker><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-muted"/></marker><marker id="ar-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-acc"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-red"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-green"/></marker><marker id="ar-x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-x"/></marker><marker id="ar-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-y"/></marker><marker id="ar-z" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-z"/></marker><marker id="ar-boxline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-boxline"/></marker><marker id="ar-inv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-inv"/></marker></defs>
<rect x="0.5" y="0.5" width="859" height="469" rx="12" class="card"/>
<rect x="150.0" y="24.0" width="300.0" height="50.0" rx="8" fill="none" class="box"/>
<text x="300.0" y="45.8" font-size="14" text-anchor="middle" class="t-text b" xml:space="preserve">face with n &gt; 3 corners</text>
<text x="300.0" y="67.6" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">one f line of the .obj</text>
<text x="470.0" y="44.0" font-size="12" text-anchor="start" class="t-muted" xml:space="preserve">n = 3: already a triangle,</text>
<text x="470.0" y="60.0" font-size="12" text-anchor="start" class="t-muted" xml:space="preserve">kept as it is</text>
<line x1="300.0" y1="76.0" x2="300.0" y2="100.0" fill="none" class="s-boxline" stroke-width="1.4" marker-end="url(#ar-boxline)"/>
<rect x="130.0" y="102.0" width="340.0" height="62.0" rx="8" fill="none" class="box"/>
<text x="300.0" y="121.7" font-size="14" text-anchor="middle" class="t-text b mono" xml:space="preserve">project_face_2d</text>
<text x="300.0" y="143.5" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">Newell normal of the face, then drop</text>
<text x="300.0" y="159.4" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">the axis where it is largest → 2D points</text>
<line x1="300.0" y1="166.0" x2="300.0" y2="190.0" fill="none" class="s-boxline" stroke-width="1.4" marker-end="url(#ar-boxline)"/>
<polygon points="300.0,192.0 505.0,240.0 300.0,288.0 95.0,240.0" class="box"/>
<text x="300.0" y="228.6" font-size="12" text-anchor="middle" class="t-text b" xml:space="preserve">first corner k that is an ear?</text>
<text x="300.0" y="244.2" font-size="12" text-anchor="middle" class="t-text" xml:space="preserve">(prev, k, next) turns left (is_convex)</text>
<text x="300.0" y="259.8" font-size="12" text-anchor="middle" class="t-text" xml:space="preserve">and holds no other corner (is_in_triangle)</text>
<line x1="300.0" y1="288.0" x2="300.0" y2="316.0" fill="none" class="s-green" stroke-width="1.4" marker-end="url(#ar-green)"/>
<text x="310.0" y="306.0" font-size="12" text-anchor="start" class="t-green" xml:space="preserve">yes</text>
<rect x="150.0" y="318.0" width="300.0" height="50.0" rx="8" fill="none" class="boxgreen"/>
<text x="300.0" y="339.8" font-size="14" text-anchor="middle" class="t-text b" xml:space="preserve">emit triangle (prev, k, next)</text>
<text x="300.0" y="361.6" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">then remove corner k</text>
<line x1="300.0" y1="370.0" x2="300.0" y2="394.0" fill="none" class="s-boxline" stroke-width="1.4" marker-end="url(#ar-boxline)"/>
<polygon points="300.0,394.0 410.0,420.0 300.0,446.0 190.0,420.0" class="box"/>
<text x="300.0" y="424.2" font-size="12" text-anchor="middle" class="t-text b" xml:space="preserve">more than 3 corners left?</text>
<path d="M190,420 L68,420 L68,240 L93,240" fill="none" class="s-green" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ar-green)"/>
<text x="62.0" y="334.0" font-size="12" text-anchor="end" class="t-green" xml:space="preserve">yes</text>
<line x1="410.0" y1="420.0" x2="550.0" y2="420.0" fill="none" class="s-boxline" stroke-width="1.4" marker-end="url(#ar-boxline)"/>
<text x="480.0" y="413.0" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">no</text>
<rect x="552.0" y="396.0" width="250.0" height="50.0" rx="8" fill="none" class="box"/>
<text x="677.0" y="417.8" font-size="14" text-anchor="middle" class="t-text b" xml:space="preserve">emit the last triangle</text>
<text x="677.0" y="439.6" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">done</text>
<line x1="505.0" y1="240.0" x2="600.0" y2="240.0" fill="none" class="s-red" stroke-width="1.4" marker-end="url(#ar-red)"/>
<text x="552.5" y="233.0" font-size="12" text-anchor="middle" class="t-red" xml:space="preserve">no ear</text>
<rect x="602.0" y="210.0" width="220.0" height="60.0" rx="8" fill="none" class="boxred"/>
<text x="712.0" y="228.7" font-size="14" text-anchor="middle" class="t-text b" xml:space="preserve">fallback: fan</text>
<text x="712.0" y="250.5" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">(v0, vi, vi+1) on the</text>
<text x="712.0" y="266.4" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">corners that are left</text>
</svg>
