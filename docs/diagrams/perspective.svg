<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440" role="img" aria-labelledby="title">
<title id="title">Perspective projection, side view</title>
<style>
.card{fill:#f6f8fa;stroke:#d0d7de}
.box{fill:#ffffff;stroke:#8c959f;stroke-width:1.2}
.boxacc{fill:#ddf4ff;stroke:#0969da;stroke-width:1.2}
.boxred{fill:#ffebe9;stroke:#cf222e;stroke-width:1.2}
.boxgreen{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.2}
.lane{fill:#eaeef2;stroke:none}
.faint{fill:#eaeef2;stroke:none}
.g1{fill:#d0d7de} .g2{fill:#afb8c1} .g3{fill:#8c959f} .g4{fill:#6e7781}
.fillacc{fill:#ddf4ff} .fillred{fill:#ffebe9} .fillgreen{fill:#dafbe1}
text{font-family:-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif;fill:#1f2328}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace}
.b{font-weight:600}
.t-text{fill:#1f2328}
.s-text{stroke:#1f2328}
.m-text{fill:#1f2328;stroke:none}
.t-muted{fill:#59636e}
.s-muted{stroke:#59636e}
.m-muted{fill:#59636e;stroke:none}
.t-acc{fill:#0969da}
.s-acc{stroke:#0969da}
.m-acc{fill:#0969da;stroke:none}
.t-red{fill:#cf222e}
.s-red{stroke:#cf222e}
.m-red{fill:#cf222e;stroke:none}
.t-green{fill:#1a7f37}
.s-green{stroke:#1a7f37}
.m-green{fill:#1a7f37;stroke:none}
.t-x{fill:#cf222e}
.s-x{stroke:#cf222e}
.m-x{fill:#cf222e;stroke:none}
.t-y{fill:#1a7f37}
.s-y{stroke:#1a7f37}
.m-y{fill:#1a7f37;stroke:none}
.t-z{fill:#0969da}
.s-z{stroke:#0969da}
.m-z{fill:#0969da;stroke:none}
.t-boxline{fill:#8c959f}
.s-boxline{stroke:#8c959f}
.m-boxline{fill:#8c959f;stroke:none}
.t-inv{fill:#ffffff}
.s-inv{stroke:#ffffff}
.m-inv{fill:#ffffff;stroke:none}
@media (prefers-color-scheme: dark) {
.card{fill:#161b22;stroke:#30363d}
.box{fill:#0d1117;stroke:#6e7681;stroke-width:1.2}
.boxacc{fill:#0c2d6b;stroke:#4493f8;stroke-width:1.2}
.boxred{fill:#4b1113;stroke:#f85149;stroke-width:1.2}
.boxgreen{fill:#0f3d1c;stroke:#3fb950;stroke-width:1.2}
.lane{fill:#21262d;stroke:none}
.faint{fill:#21262d;stroke:none}
.g1{fill:#30363d} .g2{fill:#484f58} .g3{fill:#6e7681} .g4{fill:#8b949e}
.fillacc{fill:#0c2d6b} .fillred{fill:#4b1113} .fillgreen{fill:#0f3d1c}
text{font-family:-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif;fill:#e6edf3}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace}
.b{font-weight:600}
.t-text{fill:#e6edf3}
.s-text{stroke:#e6edf3}
.m-text{fill:#e6edf3;stroke:none}
.t-muted{fill:#9198a1}
.s-muted{stroke:#9198a1}
.m-muted{fill:#9198a1;stroke:none}
.t-acc{fill:#4493f8}
.s-acc{stroke:#4493f8}
.m-acc{fill:#4493f8;stroke:none}
.t-red{fill:#f85149}
.s-red{stroke:#f85149}
.m-red{fill:#f85149;stroke:none}
.t-green{fill:#3fb950}
.s-green{stroke:#3fb950}
.m-green{fill:#3fb950;stroke:none}
.t-x{fill:#f85149}
.s-x{stroke:#f85149}
.m-x{fill:#f85149;stroke:none}
.t-y{fill:#3fb950}
.s-y{stroke:#3fb950}
.m-y{fill:#3fb950;stroke:none}
.t-z{fill:#4493f8}
.s-z{stroke:#4493f8}
.m-z{fill:#4493f8;stroke:none}
.t-boxline{fill:#6e7681}
.s-boxline{stroke:#6e7681}
.m-boxline{fill:#6e7681;stroke:none}
.t-inv{fill:#0d1117}
.s-inv{stroke:#0d1117}
.m-inv{fill:#0d1117;stroke:none}
}
</style>
<defs><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-text"/></marker><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-muted"/></marker><marker id="ar-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-acc"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-red"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-green"/></marker><marker id="ar-x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-x"/></marker><marker id="ar-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-y"/></marker><marker id="ar-z" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-z"/></marker><marker id="ar-boxline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-boxline"/></marker><marker id="ar-inv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-inv"/></marker></defs>
<rect x="0.5" y="0.5" width="859" height="439" rx="12" class="card"/>
<polygon points="50.0,215.0 470.0,41.0 470.0,389.0" fill="none" class="faint s-boxline" stroke-width="1" stroke-linejoin="round"/>
<line x1="50.0" y1="215.0" x2="520.0" y2="215.0" fill="none" class="s-muted" stroke-width="1" stroke-dasharray="3 4"/>
<text x="526.0" y="219.0" font-size="12" text-anchor="start" class="t-muted mono" xml:space="preserve">−z</text>
<line x1="140.0" y1="177.7" x2="140.0" y2="252.3" fill="none" class="s-acc" stroke-width="2.4"/>
<text x="140.0" y="270.3" font-size="12" text-anchor="middle" class="t-acc mono" xml:space="preserve">near = 0.1</text>
<text x="470.0" y="407.0" font-size="12" text-anchor="middle" class="t-text mono" xml:space="preserve">far = 10</text>
<circle cx="50.0" cy="215.0" r="5" class="m-text"/>
<text x="50.0" y="237.0" font-size="12" text-anchor="middle" class="t-text" xml:space="preserve">camera</text>
<path d="M94.3,196.6 A48,48 0 0 1 94.3,233.4" fill="none" class="s-text" stroke-width="1.2" stroke-linejoin="round"/>
<text x="104.0" y="231.0" font-size="11.5" text-anchor="start" class="t-text mono" xml:space="preserve">45°</text>
<line x1="250.0" y1="215.0" x2="250.0" y2="151.0" fill="none" class="s-text" stroke-width="4"/>
<circle cx="250.0" cy="151.0" r="4" class="m-text"/>
<line x1="50.0" y1="215.0" x2="250.0" y2="151.0" fill="none" class="s-red" stroke-width="1" stroke-dasharray="4 3"/>
<circle cx="140.0" cy="186.2" r="4.5" class="m-red"/>
<text x="250.0" y="233.0" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">near object</text>
<line x1="420.0" y1="215.0" x2="420.0" y2="151.0" fill="none" class="s-text" stroke-width="4"/>
<circle cx="420.0" cy="151.0" r="4" class="m-text"/>
<line x1="50.0" y1="215.0" x2="420.0" y2="151.0" fill="none" class="s-red" stroke-width="1" stroke-dasharray="4 3"/>
<circle cx="140.0" cy="199.4" r="4.5" class="m-red"/>
<text x="420.0" y="233.0" font-size="12" text-anchor="middle" class="t-muted" xml:space="preserve">far object</text>
<text x="590.0" y="50.0" font-size="13" text-anchor="start" class="t-text b" xml:space="preserve">Two objects of the same height:</text>
<text x="590.0" y="68.0" font-size="13" text-anchor="start" class="t-text b" xml:space="preserve">the far one hits the near plane</text>
<text x="590.0" y="86.0" font-size="13" text-anchor="start" class="t-text b" xml:space="preserve">closer to the centre (red dots),</text>
<text x="590.0" y="104.0" font-size="13" text-anchor="start" class="t-text b" xml:space="preserve">so it looks smaller.</text>
<text x="590.0" y="150.0" font-size="12.5" text-anchor="start" class="t-text b" xml:space="preserve">After P and the division by w:</text>
<text x="590.0" y="176.0" font-size="12" text-anchor="start" class="t-text mono" xml:space="preserve">fovy = 45° (vertical)</text>
<text x="590.0" y="195.0" font-size="12" text-anchor="start" class="t-text mono" xml:space="preserve">w  = −z</text>
<text x="590.0" y="214.0" font-size="12" text-anchor="start" class="t-text mono" xml:space="preserve">x&#x27; = (f / aspect) · x / −z</text>
<text x="590.0" y="233.0" font-size="12" text-anchor="start" class="t-text mono" xml:space="preserve">y&#x27; = f · y / −z</text>
<text x="590.0" y="252.0" font-size="12" text-anchor="start" class="t-text mono" xml:space="preserve">f  = cot(fovy / 2)</text>
<text x="590.0" y="271.0" font-size="12" text-anchor="start" class="t-text mono" xml:space="preserve"></text>
<text x="590.0" y="290.0" font-size="12" text-anchor="start" class="t-text mono" xml:space="preserve">z&#x27; = −1 at near, 1 at far</text>
<text x="590.0" y="309.0" font-size="12" text-anchor="start" class="t-text mono" xml:space="preserve">(before C maps it to [0, 1])</text>
<text x="40.0" y="425.0" font-size="11" text-anchor="start" class="t-muted" font-style="italic" xml:space="preserve">not to scale: near (0.1) is drawn much further from the camera</text>
</svg>
