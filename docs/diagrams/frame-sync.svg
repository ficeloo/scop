<defs><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-text"/></marker><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-muted"/></marker><marker id="ar-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-acc"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-red"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-green"/></marker><marker id="ar-x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-x"/></marker><marker id="ar-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-y"/></marker><marker id="ar-z" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-z"/></marker><marker id="ar-boxline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-boxline"/></marker><marker id="ar-inv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-inv"/></marker></defs>
<rect x="0.5" y="0.5" width="1039" height="483" rx="12" class="card"/>
<rect x="20.0" y="60.0" width="1000.0" height="104.0" rx="10" fill="none" class="lane"/>
<text x="32.0" y="106.0" font-size="14" text-anchor="start" class="t-text b" xml:space="preserve">CPU</text>
<text x="32.0" y="124.0" font-size="11.5" text-anchor="start" class="t-muted" xml:space="preserve">App::render</text>
<rect x="20.0" y="190.0" width="1000.0" height="104.0" rx="10" fill="none" class="lane"/>
<text x="32.0" y="236.0" font-size="14" text-anchor="start" class="t-text b" xml:space="preserve">GPU</text>
<text x="32.0" y="254.0" font-size="11.5" text-anchor="start" class="t-muted" xml:space="preserve">graphics queue</text>
<rect x="20.0" y="320.0" width="1000.0" height="104.0" rx="10" fill="none" class="lane"/>
<text x="32.0" y="366.0" font-size="14" text-anchor="start" class="t-text b" xml:space="preserve">Presentation</text>
<text x="32.0" y="384.0" font-size="11.5" text-anchor="start" class="t-muted" xml:space="preserve">swapchain</text>
<rect x="140.0" y="82.0" width="109.0" height="56.0" rx="8" fill="none" class="box"/>
<text x="194.5" y="107.3" font-size="12.5" text-anchor="middle" class="t-text b" xml:space="preserve">1. wait fence</text>
<text x="194.5" y="127.1" font-size="10.5" text-anchor="middle" class="t-muted mono" xml:space="preserve">in_flight[f]</text>
<rect x="261.0" y="82.0" width="88.0" height="56.0" rx="8" fill="none" class="box"/>
<text x="305.0" y="107.3" font-size="12.5" text-anchor="middle" class="t-text b" xml:space="preserve">2. acquire</text>
<text x="305.0" y="127.1" font-size="10.5" text-anchor="middle" class="t-muted mono" xml:space="preserve">image i</text>
<rect x="361.0" y="82.0" width="139.7" height="56.0" rx="8" fill="none" class="box"/>
<text x="430.8" y="107.3" font-size="12.5" text-anchor="middle" class="t-text b" xml:space="preserve">3. wait fence</text>
<text x="430.8" y="127.1" font-size="10.5" text-anchor="middle" class="t-muted mono" xml:space="preserve">images_in_flight[i]</text>
<rect x="512.7" y="82.0" width="107.7" height="56.0" rx="8" fill="none" class="box"/>
<text x="566.5" y="107.3" font-size="12.5" text-anchor="middle" class="t-text b" xml:space="preserve">4. record</text>
<text x="566.5" y="127.1" font-size="10.5" text-anchor="middle" class="t-muted mono" xml:space="preserve">commands + ubo</text>
<rect x="632.4" y="82.0" width="94.9" height="56.0" rx="8" fill="none" class="box"/>
<text x="679.8" y="107.3" font-size="12.5" text-anchor="middle" class="t-text b" xml:space="preserve">5. submit</text>
<text x="679.8" y="127.1" font-size="10.5" text-anchor="middle" class="t-muted mono" xml:space="preserve">queue_submit</text>
<rect x="739.2" y="82.0" width="126.9" height="56.0" rx="8" fill="none" class="box"/>
<text x="802.7" y="107.3" font-size="12.5" text-anchor="middle" class="t-text b" xml:space="preserve">6. present</text>
<text x="802.7" y="127.1" font-size="10.5" text-anchor="middle" class="t-muted mono" xml:space="preserve">queue_present_khr</text>
<rect x="878.1" y="82.0" width="88.5" height="56.0" rx="8" fill="none" class="box"/>
<text x="922.3" y="107.3" font-size="12.5" text-anchor="middle" class="t-text b" xml:space="preserve">7. update</text>
<text x="922.3" y="127.1" font-size="10.5" text-anchor="middle" class="t-muted mono" xml:space="preserve">move, f + 1</text>
<line x1="250.0" y1="110.0" x2="260.0" y2="110.0" fill="none" class="s-boxline" stroke-width="1.2" marker-end="url(#ar-boxline)"/>
<line x1="350.0" y1="110.0" x2="360.0" y2="110.0" fill="none" class="s-boxline" stroke-width="1.2" marker-end="url(#ar-boxline)"/>
<line x1="501.7" y1="110.0" x2="511.7" y2="110.0" fill="none" class="s-boxline" stroke-width="1.2" marker-end="url(#ar-boxline)"/>
<line x1="621.4" y1="110.0" x2="631.4" y2="110.0" fill="none" class="s-boxline" stroke-width="1.2" marker-end="url(#ar-boxline)"/>
<line x1="728.2" y1="110.0" x2="738.2" y2="110.0" fill="none" class="s-boxline" stroke-width="1.2" marker-end="url(#ar-boxline)"/>
<line x1="867.1" y1="110.0" x2="877.1" y2="110.0" fill="none" class="s-boxline" stroke-width="1.2" marker-end="url(#ar-boxline)"/>
<line x1="305.0" y1="140.0" x2="305.0" y2="340.0" fill="none" class="s-boxline" stroke-width="1.2" marker-end="url(#ar-boxline)"/>
<rect x="251.0" y="342.0" width="230.0" height="56.0" rx="8" fill="none" class="box"/>
<text x="366.0" y="367.3" font-size="12.5" text-anchor="middle" class="t-text b" xml:space="preserve">hands out image i</text>
<text x="366.0" y="387.1" font-size="10.5" text-anchor="middle" class="t-muted mono" xml:space="preserve">signals image_available[f]</text>
<line x1="679.8" y1="140.0" x2="679.8" y2="210.0" fill="none" class="s-boxline" stroke-width="1.2" marker-end="url(#ar-boxline)"/>
<rect x="602.4" y="212.0" width="250.0" height="64.0" rx="8" fill="none" class="boxacc"/>
<text x="727.4" y="234.0" font-size="12.5" text-anchor="middle" class="t-text b" xml:space="preserve">draws the frame</text>
<text x="727.4" y="251.0" font-size="10.5" text-anchor="middle" class="t-muted mono" xml:space="preserve">waits image_available[f]</text>
<text x="727.4" y="266.0" font-size="10" text-anchor="middle" class="t-muted mono" xml:space="preserve">signals render_finished[i], in_flight[f]</text>
<path d="M483.0,370 C522.3649999999999,370 542.3649999999999,244 600.3649999999999,244" fill="none" class="s-acc" stroke-width="1.4" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#ar-acc)"/>
<text x="493.0" y="394.0" font-size="10.5" text-anchor="start" class="t-acc mono" xml:space="preserve">image_available[f]</text>
<line x1="860.1" y1="140.0" x2="860.1" y2="340.0" fill="none" class="s-boxline" stroke-width="1.2" marker-end="url(#ar-boxline)"/>
<rect x="719.2" y="342.0" width="166.9" height="56.0" rx="8" fill="none" class="box"/>
<text x="802.7" y="367.3" font-size="12.5" text-anchor="middle" class="t-text b" xml:space="preserve">shows image i</text>
<text x="802.7" y="387.1" font-size="10.5" text-anchor="middle" class="t-muted mono" xml:space="preserve">waits render_finished[i]</text>
<path d="M822.3649999999999,278 L822.3649999999999,340" fill="none" class="s-acc" stroke-width="1.4" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#ar-acc)"/>
<text x="816.4" y="316.0" font-size="10.5" text-anchor="end" class="t-acc mono" xml:space="preserve">render_finished[i]</text>
<path d="M854.3649999999999,230 L1005,230 L1005,40 L194.5,40 L194.5,80" fill="none" class="s-green" stroke-width="1.4" stroke-linejoin="round" stroke-dasharray="2 3" marker-end="url(#ar-green)"/>
<text x="560.0" y="34.0" font-size="11" text-anchor="middle" class="t-green" xml:space="preserve">in_flight[f] is signalled when the GPU is done: step 1 of the frame that reuses f waits on it</text>
<line x1="40.0" y1="424.0" x2="70.0" y2="424.0" fill="none" class="s-boxline" stroke-width="1.4" marker-end="url(#ar-boxline)"/>
<text x="76.0" y="428.0" font-size="11.5" text-anchor="start" class="t-muted" xml:space="preserve">CPU call</text>
<line x1="170.0" y1="424.0" x2="200.0" y2="424.0" fill="none" class="s-acc" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ar-acc)"/>
<text x="206.0" y="428.0" font-size="11.5" text-anchor="start" class="t-muted" xml:space="preserve">semaphore: GPU and presentation wait for each other</text>
<line x1="540.0" y1="424.0" x2="570.0" y2="424.0" fill="none" class="s-green" stroke-width="1.4" stroke-dasharray="2 3" marker-end="url(#ar-green)"/>
<text x="576.0" y="428.0" font-size="11.5" text-anchor="start" class="t-muted" xml:space="preserve">fence: the CPU waits for the GPU</text>
<text x="40.0" y="452.0" font-size="11" text-anchor="start" class="t-muted mono" xml:space="preserve">f = frame (0, 1, 0, 1…)   i = image_index   images_in_flight[i] = fence of the last frame that used image i</text>
<text x="40.0" y="468.0" font-size="11" text-anchor="start" class="t-muted mono" xml:space="preserve">step 5 resets in_flight[f] just before queue_submit</text>
</svg>
