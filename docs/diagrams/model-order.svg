.t-y{fill:#1a7f37}
.s-y{stroke:#1a7f37}
.m-y{fill:#1a7f37;stroke:none}
.t-z{fill:#0969da}
.s-z{stroke:#0969da}
.m-z{fill:#0969da;stroke:none}
