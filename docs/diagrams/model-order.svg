<defs><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-text"/></marker><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-muted"/></marker><marker id="ar-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-acc"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-red"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-green"/></marker><marker id="ar-x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-x"/></marker><marker id="ar-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-y"/></marker><marker id="ar-z" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-z"/></marker><marker id="ar-boxline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-boxline"/></marker><marker id="ar-inv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-inv"/></marker></defs>
<rect x="0.5" y="0.5" width="859" height="199" rx="12" class="card"/>
<text x="104.9" y="88.0" font-size="26" text-anchor="start" class="t-text mono" xml:space="preserve">model = </text>
<text x="231.8" y="88.0" font-size="26" text-anchor="start" class="t-acc b mono" xml:space="preserve">T</text>
<text x="247.6" y="88.0" font-size="26" text-anchor="start" class="t-text mono" xml:space="preserve"> × </text>
<text x="295.2" y="88.0" font-size="26" text-anchor="start" class="t-acc b mono" xml:space="preserve">orientation</text>
<text x="469.6" y="88.0" font-size="26" text-anchor="start" class="t-text mono" xml:space="preserve"> × </text>
<text x="517.2" y="88.0" font-size="26" text-anchor="start" class="t-acc b mono" xml:space="preserve">R_auto</text>
<text x="612.4" y="88.0" font-size="26" text-anchor="start" class="t-text mono" xml:space="preserve"> × </text>
<text x="660.0" y="88.0" font-size="26" text-anchor="start" class="t-muted mono" xml:space="preserve">vertex</text>
<line x1="239.7" y1="98.0" x2="239.7" y2="116.0" fill="none" class="s-acc" stroke-width="1.4"/>
<text x="239.7" y="134.0" font-size="13" text-anchor="middle" class="t-text b" xml:space="preserve">3rd: move</text>
<text x="239.7" y="152.0" font-size="12" text-anchor="middle" class="t-muted mono" xml:space="preserve">W A S D Q E</text>
<line x1="382.4" y1="98.0" x2="382.4" y2="116.0" fill="none" class="s-acc" stroke-width="1.4"/>
<text x="382.4" y="134.0" font-size="13" text-anchor="middle" class="t-text b" xml:space="preserve">2nd: manual rotation</text>
<text x="382.4" y="152.0" font-size="12" text-anchor="middle" class="t-muted mono" xml:space="preserve">I K U O J L</text>
<line x1="564.8" y1="98.0" x2="564.8" y2="116.0" fill="none" class="s-acc" stroke-width="1.4"/>
<text x="564.8" y="134.0" font-size="13" text-anchor="middle" class="t-text b" xml:space="preserve">1st: automatic spin</text>
<text x="564.8" y="152.0" font-size="12" text-anchor="middle" class="t-muted mono" xml:space="preserve">around Z (= - 0)</text>
<line x1="700.0" y1="36.0" x2="250.0" y2="36.0" fill="none" class="s-muted" stroke-width="1.4" marker-end="url(#ar-muted)"/>
<text x="475.0" y="29.0" font-size="12.5" text-anchor="middle" class="t-muted" xml:space="preserve">applied to the vertex from right to left</text>
</svg>
